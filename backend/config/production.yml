server:
  addr: ":8080"
  public_base_url: https://dynamicpdb.com/api
  rate_limit:
    # Pod network (ingress pods and the node addresses kube-proxy rewrites load balancer
    # traffic to) and the AWS VPC (load balancer).
    trusted_proxies:
      - 10.42.0.0/16
      - 10.7.0.0/16
auth:
  allowed_orgs:
    - Astera-org
    - prism-science
  github:
    client_id: "Ov23liRjWaMI9Ur5X57e"
    client_secret: ""
  jwt:
    secret: ""
    issuer: dynamic-pdb-backend
    ttl: 720h
db:
  host: ""
  port: 5432
  name: ""
  username: ""
  password: ""
  connection_params: sslmode=require
  max_open_connections: 20
  max_idle_connections: 10
  max_connection_idle_time: 5m
  max_connection_lifetime: 30m
  statement_timeout: 10s
cdn:
  s3:
    endpoint: ""
    region: us-west-1
    bucket: dynamic-pdb-data
    access_key_id: ""
    secret_access_key: ""
    upload_max_file_size: 1073741824
    upload_url_ttl: 15m
  cloudfront:
    base_url: https://files.dynamicpdb.com
analytics:
  endpoint: https://cloud.umami.is/api/send
  website_id: 41e0ae39-0a08-45d0-bf1a-3a4f34bbc40c
  hostname: dynamicpdb.com
validation:
  # Reject requests that break the schema rules with 422, and skip RCSB versions that break them.
  # log_only stays available as the rollback: set it here, or DYNAMIC_PDB_VALIDATION_MODE=log_only.
  mode: enforce
  # Reject request keys the API does not define, and keys starting with "__" (HTTP 422). Logged only
  # (rule=request_keys) from 2026-11-04 15:50Z with 0 hits, then switched as on dev. Rollback:
  # log_only here, or DYNAMIC_PDB_VALIDATION_REQUEST_KEYS=log_only.
  request_keys: enforce
data_sync:
  # Coordinate-change revisions are on: the checksum job has copied the coordinate files. A file it
  # has not verified and copied yet keeps its entry waiting until a later sync.
  coordinate_revisions: true
entries:
  # Entry deletion is for testing on dev only; production keeps every entry.
  delete_enabled: false
artifact_extraction:
  # The deposition forms read an uploaded mmCIF through the server before saving (G5), as on dev,
  # where it was tried on 2026-11-05. Rollback: false here, or
  # DYNAMIC_PDB_ARTIFACT_EXTRACTION_UPLOADS_ENABLED=false; the forms then keep their browser preview.
  uploads_enabled: true
revisions:
  # Publishing a change always takes a second reviewer; self-approval is for testing on dev only.
  self_approval_enabled: false
compounds:
  # The model-compounds job also reads archive model files, from the checksum job's copies: new
  # copies through its recent window (archive_files), and older ones through a fill that tops
  # the queue up each run (archive_fill). See deploy/README.md, "Archive model files".
  archive_files: true
  archive_fill: false
model_search:
  # Search filters, the capped total and the entry and review warnings on GET /v1/models (S1) stay
  # off until their own switch-on PR. Rollback after that: false here, or
  # DYNAMIC_PDB_MODEL_SEARCH_FILTERS_ENABLED=false. count_cap and rate_limit keep their defaults.
  filters_enabled: false
