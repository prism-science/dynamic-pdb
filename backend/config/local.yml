server:
  addr: ":8080"
  public_base_url: http://localhost:8080
auth:
  allowed_orgs:
    - Astera-org
    - prism-science
  github:
    client_id: local-github-client-id
    client_secret: local-github-client-secret
  jwt:
    secret: sample-secret
    issuer: dynamic-pdb-backend
    ttl: 720h
db:
  host: localhost
  port: 35432
  name: dynamic_pdb_local
  username: postgres
  password: password
  connection_params: sslmode=disable
  max_open_connections: 20
  max_idle_connections: 10
  max_connection_idle_time: 5m
  max_connection_lifetime: 30m
  statement_timeout: 10s
cdn:
  s3:
    endpoint: ""
    region: us-east-1
    bucket: dynamic-pdb
    access_key_id: ""
    secret_access_key: ""
    upload_max_file_size: 1073741824
    upload_url_ttl: 15m
  cloudfront:
    base_url: ""
validation:
  # Reject requests that break Dynamic PDB Schema v0.2.0 (HTTP 422).
  mode: enforce
  # Reject request keys the API does not define, and keys starting with "__" (HTTP 422).
  request_keys: enforce
data_sync:
  # Coordinate-change revisions stay off until the checksum job has copied the coordinate files.
  coordinate_revisions: false
entries:
  # Reviewers can soft-delete entries, so the delete button can be tested locally.
  delete_enabled: true
artifact_extraction:
  # The deposition forms read an uploaded mmCIF through the server before saving (G5).
  uploads_enabled: true
revisions:
  # As on production: a second reviewer approves each revision, so the guard can be tested locally.
  self_approval_enabled: false
compounds:
  # The model-compounds job also reads archive model files, from the checksum job's copies: new
  # copies through its recent window (archive_files), and older ones through a fill that tops
  # the queue up each run (archive_fill). See deploy/README.md, "Archive model files".
  archive_files: false
  archive_fill: false
coordinate_index:
  # The coordinate-index job (S2) also reads archive model files, from the checksum job's copies,
  # through its recent window and its fill. See deploy/README.md, "Coordinate index job".
  archive_files: false
model_search:
  # Search filters on GET /v1/models (S1) are on locally, so the website's search can be built
  # against them before dev and production switch them on.
  filters_enabled: true
  # The protein chain filters (S2) read the coordinate-index job's chains; locally they are on so
  # the website can be built against them.
  chain_filters_enabled: true
selections:
  # Frozen selections (/v1/selections, B1) are on locally, so the website's download panel can be
  # built against them before dev and production switch them on.
  enabled: true
