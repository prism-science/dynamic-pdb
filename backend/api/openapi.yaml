          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/revisions/{revision_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      operationId: getUserEntryRevision
      summary: Get entry revision
      description: >
        Returns a revision created by the path user. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entry revision found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryRevisionDocument"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry revision not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/models/{model_id}/revisions:
    get:
      tags: [Users]
      operationId: listUserModelRevisionsForModel
      summary: List model revisions
      description: >
        Lists the path user's revisions of one model. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: >
            Deprecated: use `cursor`. Number of revisions to skip. Deep offsets get slower
            and can skip or repeat rows while data changes.
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the revisions
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Model revisions found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelRevisionSummaryCollectionDocument"
        "400":
          description: Invalid cursor.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/models/{model_id}/revisions/{revision_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      operationId: getUserModelRevision
      summary: Get model revision
      description: >
        Returns a revision created by the path user. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model revision found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelRevisionDocument"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model revision not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Users]
      operationId: submitUserModelRevision
      summary: Submit model revision
      description: >
        The authenticated user ID must equal `user_id`. Changes a pending or
        rejected model revision to `in_review`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/SubmitRevisionRequest"
      responses:
        "200":
          description: Model revision updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelRevisionDocument"
        "400":
          description: Invalid state transition.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id or own the revision.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model revision not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Model revision is not editable.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorObject"

    ErrorObject:
      type: object
      required: [status]
      properties:
        status:
          type: string
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        source:
          $ref: "#/components/schemas/ErrorSource"

    ErrorSource:
      type: object
      required: [pointer]
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON pointer to the request field the error is about, for example /model/metrics/0/key.

    ProbeMeta:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ProbeDocument:
      type: object
      required: [meta]
      properties:
        meta:
          $ref: "#/components/schemas/ProbeMeta"

    TokenDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TokenData"

    TokenData:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
        attributes:
          $ref: "#/components/schemas/TokenAttributes"

    FileUploadGrantDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FileUploadGrantData"

    FileUploadGrantData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/FileUploadGrantAttributes"

    CompleteFileUploadDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CompleteFileUploadData"

    CompleteFileUploadData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/CompleteFileUploadAttributes"

    EntryCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EntryInfoData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/CursorPageMeta"

    CollectionLinks:
      type: object
      description: Present only when another page exists.
      required: [next]
      properties:
        next:
          type: string
          description: Absolute URL of the next page, with the same filters and limit.

    CursorPageMeta:
      type: object
      description: Present only when another page exists.
      required: [next_cursor]
      properties:
        next_cursor:
          type: string
          description: Pass as `cursor` to get the next page.

    EntryInfoData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/EntryInfoAttributes"

    SimilarEntryCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SimilarEntryData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/SimilarEntryCollectionMeta"

    SimilarEntryData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SimilarEntryAttributes"

    SimilarEntryCollectionMeta:
      type: object
      properties:
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        next_cursor:
          type: string
          description: Present only when another page exists. Pass as `cursor` to get the next page.

    ModelCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/CursorPageMeta"

    ModelDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ModelDetailData"

    ModelDetailData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/ModelDetailAttributes"

    ModelDetailAttributes:
      description: >
        A model as the model detail endpoint returns it: the list attributes plus where the
        values of its archive-synced fields came from.
      allOf:
        - $ref: "#/components/schemas/ModelAttributes"
        - type: object
          required: [field_sources]
          properties:
            field_sources:
              $ref: "#/components/schemas/FieldSources"

    ModelData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/ModelAttributes"

    ArtifactCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/CursorPageMeta"

    ArtifactData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/ArtifactAttributes"

    ModelArtifactCollectionDocument:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/ModelArtifactCollectionMeta"

    ModelArtifactCollectionMeta:
      type: object
      description: Runs and relations cover the whole model revision and repeat on every page.
      required: [runs, relations]
      properties:
        next_cursor:
          type: string
          description: Present only when another page exists. Pass as `cursor` to get the next page.
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/RunArtifact"

    CreateEntryRevisionDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CreateEntryRevisionData"

    CreateEntryRevisionData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/CreateEntryRevisionAttributes"

    CreateModelRevisionDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CreateModelRevisionData"

    CreateModelRevisionData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/CreateModelRevisionAttributes"

    EntryRevisionGroupCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EntryRevisionGroupData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/CursorPageMeta"

    EntryRevisionGroupData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/EntryRevisionGroupAttributes"

    EntryRevisionSummaryCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EntryRevisionSummaryData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/CursorPageMeta"

    EntryRevisionSummaryData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/EntryRevisionSummaryAttributes"

    ModelRevisionSummaryCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelRevisionSummaryData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/CursorPageMeta"

    ModelRevisionSummaryData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/ModelRevisionSummaryAttributes"

    EntryRevisionDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/EntryRevisionData"

    EntryRevisionData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/EntryRevisionAttributes"

    ModelRevisionDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ModelRevisionData"

    ModelRevisionData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/ModelRevisionAttributes"

    CreateFileUploadRequest:
      type: object
      required: [entry_id, artifact_id, filename, size]
      properties:
        entry_id:
          type: string
          description: Entry identifier that owns this file.
        model_id:
          type: string
          nullable: true
          description: Model identifier for model-level files; null for entry-level files.
        artifact_id:
          type: string
          format: uuid
          description: Artifact identifier this file belongs to.
        filename:
          type: string
          minLength: 1
          description: Original filename to keep as the final object key suffix.
        size:
          type: integer
          format: int64
          description: Total size in bytes of the file to upload.

    FileUploadGrantAttributes:
      type: object
      required: [key, upload_id, object_url, part_size, parts]
      properties:
        key:
          type: string
          description: Object key the assembled file will be stored under.
        upload_id:
          type: string
          description: Identifier of the initiated multipart upload; echoed back on complete and abort.
        object_url:
          type: string
          description: Public HTTP object URL to store with the artifact.
        part_size:
          type: integer
          format: int64
          description: Size in bytes of every part except the last; the client must slice the file at this boundary.
        parts:
          type: array
          description: Presigned PUT targets, one per part, in ascending part-number order.
          items:
            $ref: "#/components/schemas/FileUploadPart"

    FileUploadPart:
      type: object
      required: [part_number, url]
      properties:
        part_number:
          type: integer
          description: 1-based index of this part.
        url:
          type: string
          description: Presigned URL the client PUTs this part's bytes to.

    CompleteFileUploadRequest:
      type: object
      required: [key, upload_id, parts]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.
        parts:
          type: array
          description: The uploaded parts, each with the ETag object storage returned for it.
          items:
            $ref: "#/components/schemas/CompletedFileUploadPart"

    CompletedFileUploadPart:
      type: object
      required: [part_number, etag]
      properties:
        part_number:
          type: integer
          description: 1-based index of the part.
        etag:
          type: string
          description: ETag returned in the response header when the part was uploaded.

    CompleteFileUploadAttributes:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Object key the completed file is stored under.

    AbortFileUploadRequest:
      type: object
      required: [key, upload_id]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.

    GitHubExchangeRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    GitHubCodeExchangeRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
        redirect_uri:
          type: string

    TokenAttributes:
      type: object
      required: [token_type, access_token, expires_at, name, email, login, permissions]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
        login:
          type: string
        permissions:
          type: array
          items:
            type: string

    EntryProperties:
      type: object
      properties:
        external_refs:
          type: object
          additionalProperties:
            type: string
        details:
          type: string
          description: Additional structure remarks; RCSB sync maps struct.pdbx_details here.
        resolution:
          type: number
          format: double
        method:
          type: string
        space_group:
          type: string
        crystallography:
          $ref: "#/components/schemas/EntryCrystallography"
        ligands:
          type: array
          description: >
            Ligand component IDs of the sample. Absent means unknown; an empty list means none.
          items:
            type: string
        cofactors:
          type: array
          description: >
            Cofactor component IDs of the sample. Absent means unknown; an empty list means none.
          items:
            type: string

    EntryCrystallography:
      type: object
      description: Crystals and diffraction datasets reported for this entry.
      properties:
        crystals:
          type: array
          items:
            $ref: "#/components/schemas/EntryCrystal"

    EntryCrystal:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: RCSB exptl_crystal.id.
        growth:
          $ref: "#/components/schemas/EntryCrystalGrowth"
        diffractions:
          type: array
          items:
            $ref: "#/components/schemas/EntryDiffraction"

    EntryCrystalGrowth:
      type: object
      properties:
        ph:
          type: number
          format: double
          description: Crystal-growth pH from RCSB exptl_crystal_grow.pH.
        temperature_kelvin:
          type: number
          format: double
          description: Crystal-growth temperature in kelvins from RCSB exptl_crystal_grow.temp.

    EntryDiffraction:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: RCSB diffrn.id.
        temperature_kelvin:
          type: number
          format: double
          description: Data-collection temperature in kelvins from RCSB diffrn.ambient_temp.

    EntryInfoAttributes:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          required: [id, created_by, title, created_at, updated_at]
          properties:
            id:
              type: string
            created_by:
              type: string
              format: uuid
            title:
              type: string
              nullable: true
            thumbnail_image_url:
              type: string
              nullable: true
            published_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    SimilarEntryAttributes:
      type: object
      required: [entry, score, matches]
      properties:
        entry:
          $ref: "#/components/schemas/EntryInfoAttributes"
        score:
          type: number
          format: double
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ProteinSequenceSimilarityMatch"

    ProteinSequenceSimilarityMatch:
      type: object
      required: [source_sequence_id, similar_sequence, score, tool, metadata, created_at]
      properties:
        source_sequence_id:
          type: string
          format: uuid
        similar_sequence:
          $ref: "#/components/schemas/ProteinSequence"
        score:
          type: number
          format: double
        tool:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    CreateEntryRequest:
      type: object
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/CreateEntryData"
        model_operations:
          type: array
          description: Models to create as independent in-review revisions.
          items:
            $ref: "#/components/schemas/AddModelOperation"

    CreateEntryData:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          required: [title, method]
          properties:
            title:
              type: string
              minLength: 1
            thumbnail_image_url:
              type: string
              nullable: true
            artifacts:
              type: array
              items:
                $ref: "#/components/schemas/CreateArtifactRequest"
            polymer_entities:
              $ref: "#/components/schemas/DepositorPolymerEntities"

    Entry:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          required: [id, created_by, title, created_at, updated_at, protein_sequences]
          properties:
            id:
              type: string
            created_by:
              type: string
              format: uuid
            title:
              type: string
              nullable: true
            thumbnail_image_url:
              type: string
              nullable: true
            published_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            protein_sequences:
              type: array
              items:
                $ref: "#/components/schemas/ProteinSequence"

    ArchivePdbDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ArchivePdbData"

    ArchivePdbData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [archive_pdb_lookups]
        id:
          type: string
          description: Upper-case PDB ID.
        attributes:
          $ref: "#/components/schemas/ArchivePdbAttributes"

    ArchivePdbAttributes:
      type: object
      required: [entry, model, polymer_entities, warnings]
      properties:
        entry:
          $ref: "#/components/schemas/ArchiveEntryProposal"
        model:
          $ref: "#/components/schemas/ArchiveModelProposal"
        polymer_entities:
          type: array
          items:
            $ref: "#/components/schemas/ArchivePolymerEntityProposal"
        warnings:
          type: array
          description: Problems with the lookup as a whole, such as an unknown UniProt release.
          items:
            $ref: "#/components/schemas/ArchiveWarning"

    ArchiveReport:
      type: object
      required: [provenance, conflicts, warnings]
      properties:
        provenance:
          type: object
          description: Maps each proposed field to the RCSB path it is read from.
          additionalProperties:
            type: string
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveConflict"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveWarning"

    ArchiveConflict:
      type: object
      required: [field, chosen, others]
      properties:
        field:
          type: string
        chosen:
          type: string
          description: The value that is proposed.
        others:
          type: array
          description: Other values RCSB reports for the field.
          items:
            type: string

    ArchiveWarning:
      type: object
      required: [source, detail]
      properties:
        source:
          type: string
          enum: [archive, validation]
          description: >
            `archive` for a problem found while reading RCSB, `validation` for a
            proposed value that breaks the schema rules.
        field:
          type: string
          description: Proposed field the warning is about, for `archive` warnings.
        pointer:
          type: string
          description: JSON pointer into the proposal, for `validation` warnings.
        code:
          type: string
          description: Validation code, for `validation` warnings.
        detail:
          type: string

    ArtifactExtractionDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ArtifactExtractionData"

    ArtifactExtractionData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [artifact_extractions]
        id:
          type: string
          format: uuid
          description: The artifact ID.
        attributes:
          $ref: "#/components/schemas/ArtifactExtractionAttributes"

    ArtifactExtractionAttributes:
      type: object
      required: [source, reference_version, bytes_read, object_size, truncated, values, warnings]
      properties:
        source:
          type: string
          description: "`file:<sha256>` of the artifact; every value carries the same source."
        reference_version:
          type: string
          description: Version of the cofactor reference list that sorted compounds into cofactors and ligands.
        bytes_read:
          type: integer
          format: int64
        object_size:
          type: integer
          format: int64
        truncated:
          type: boolean
          description: True when the file is larger than the bytes read.
        values:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedValue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionWarning"

    ExtractedValue:
      type: object
      required: [name, value, source, needs_review]
      properties:
        name:
          type: string
          description: >
            One of `atom_count`, `modeled_residues`, `unique_protein_chains`,
            `altloc_fraction`, `ligands`, `cofactors`, `mutations`,
            `program_name`, `program_version`.
        value:
          description: >
            A number for the counts and fraction, a string for the program, and
            a list of compounds or mutation sets for the others.
        source:
          type: string
          description: "`file:<sha256>`."
        needs_review:
          type: boolean
        review_reason:
          type: string

    ExtractionWarning:
      type: object
      required: [detail]
      properties:
        field:
          type: string
        pointer:
          type: string
          description: JSON pointer into the extracted values, for schema-rule violations.
        code:
          type: string
        detail:
          type: string

    ArchiveRevisionGroup:
      type: object
      required: [group, revision_ordinal]
      properties:
        group:
          type: string
        revision_ordinal:
          type: integer

    ArchiveEntryProposal:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - $ref: "#/components/schemas/ArchiveReport"
        - type: object
          required: [revision_groups, supersedes, superseded_by]
          properties:
            title:
              type: string
              nullable: true
            status_code:
              type: string
              description: RCSB status, for example `REL`.
            initial_release_date:
              type: string
              format: date-time
            latest_revision_date:
              type: string
              format: date-time
            latest_version:
              type: string
              description: Latest RCSB major and minor version, for example `4.3`.
            revision_groups:
              type: array
              items:
                $ref: "#/components/schemas/ArchiveRevisionGroup"
            supersedes:
              type: array
              description: PDB IDs this entry replaced.
              items:
                type: string
            superseded_by:
              type: array
              description: PDB IDs that replaced this entry when it was made obsolete.
              items:
                type: string

    ArchiveMetric:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: number
          format: double
        software_name:
          type: string
          nullable: true
          description: Program the archive names as the producer of the value; null when it names none.
        software_version:
          type: string
          nullable: true

    ArchiveModelProposal:
      allOf:
        - $ref: "#/components/schemas/ArchiveReport"
        - type: object
          required: [authors, ligands, metrics]
          properties:
            details:
              type: string
            authors:
              type: array
              items:
                type: string
            affiliation:
              type: string
            atom_count:
              type: integer
            modeled_residues:
              type: integer
            unique_protein_chains:
              type: integer
            unmodeled_fraction:
              type: number
              format: double
            ligands:
              type: array
              items:
                type: string
            metrics:
              type: array
              items:
                $ref: "#/components/schemas/ArchiveMetric"

    ArchiveUniProtMapping:
      type: object
      required: [accession, source]
      properties:
        accession:
          type: string
        source:
          type: string
          description: One of `sifts`, `struct_ref`, or `alignment`.
        unp_release:
          type: string

    ArchivePolymerEntityProposal:
      allOf:
        - $ref: "#/components/schemas/ArchiveReport"
        - type: object
          required: [source_organisms, uniprot_mappings]
          properties:
            label_entity_id:
              type: string
            description:
              type: string
            source_organisms:
              type: array
              items:
                $ref: "#/components/schemas/PolymerEntityOrganism"
            construct:
              type: string
            mutations:
              type: array
              description: Substitution strings such as C54T, one per element.
              items:
                type: string
            mutations_raw:
              type: string
              description: >
                Mutation text exactly as the source gave it (for example "C54T, ENGINEERED MUTATION").
                Present when the text was read into mutations, so text that is not a plain
                substitution is not hidden by an empty list.
            mutations_status:
              type: string
              enum: [parsed, needs_review, none]
              description: >
                How much of mutations_raw is in mutations. parsed: every token is a substitution.
                needs_review: some token is not a plain substitution and is only in mutations_raw.
                none: the text names no mutation. Absent when the source gave no text.
            uniprot_mappings:
              type: array
              items:
                $ref: "#/components/schemas/ArchiveUniProtMapping"

    EntryDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/EntryData"
        included:
          type: array
          items:
            $ref: "#/components/schemas/EntryProteinSequenceData"

    EntryData:
      type: object
      required: [type, id, attributes, relationships]
      properties:
        type:
          type: string
          enum: [entries]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/EntryAttributes"
        relationships:
          $ref: "#/components/schemas/EntryRelationships"

    EntryAttributes:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          required: [title, created_at, updated_at, polymer_entities, depositor_polymer_entities, field_sources]
          properties:
            title:
              type: string
              nullable: true
            thumbnail_image_url:
              type: string
              nullable: true
            published_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            polymer_entities:
              type: array
              items:
                $ref: "#/components/schemas/PolymerEntity"
            depositor_polymer_entities:
              description: >
                The polymer-entity values a depositor typed for the active revision, as sent in
                polymer_entities on create or revision; empty when none were typed. Read-only.
              allOf:
                - $ref: "#/components/schemas/DepositorPolymerEntities"
            field_sources:
              $ref: "#/components/schemas/FieldSources"
            archive_status:
              $ref: "#/components/schemas/EntryArchiveStatus"

    EntryArchiveStatus:
      type: object
      description: >
        Present when the PDB archive no longer serves the entry's PDB entry. Only the archive sync
