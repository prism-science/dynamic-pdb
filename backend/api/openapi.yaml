          description: Required by Dynamic PDB Schema v0.2.0. A request without it gets 422.
        uri:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
          description: File encoding, lowercase, from an open vocabulary (for example mmcif, mtz, fasta). Uppercase letters get 422.
        size_bytes:
          type: integer
          format: int64
          nullable: true
        metadata:
          $ref: "#/components/schemas/ArtifactMetadata"

    ArtifactAttributes:
      type: object
      required: [id, name, level, type, metadata, created_by, created_at, checksum]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          $ref: "#/components/schemas/ArtifactLevel"
        type:
          $ref: "#/components/schemas/ArtifactType"
        uri:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        metadata:
          $ref: "#/components/schemas/ArtifactMetadata"
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        checksum:
          $ref: "#/components/schemas/ArtifactChecksum"

    ArtifactChecksum:
      type: object
      description: >-
        What the checksum job computed from the file's bytes. The artifact's own sha256 and
        size_bytes are the values the uploader declared. Read-only.
      required: [status, sha256, size_bytes, stored_uri, copy_status, checked_at]
      properties:
        status:
          $ref: "#/components/schemas/ArtifactChecksumStatus"
        sha256:
          type: string
          nullable: true
          description: The sha256 of the bytes, set once they were read.
        size_bytes:
          type: integer
          format: int64
          nullable: true
          description: The size of the bytes, set once they were read.
        stored_uri:
          type: string
          nullable: true
          description: >-
            Our copy of an external file, set when copy_status is copied. Empty for files
            uploaded to our storage, whose uri already points there.
        copy_status:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ArtifactChecksumCopyStatus"
          description: >-
            Whether we keep a copy of the file, and if not, why. Set once the bytes were read
            (status verified or mismatch); null while pending and when failed.
        checked_at:
          type: string
          format: date-time
          nullable: true

    ArtifactChecksumStatus:
      type: string
      description: >-
        pending: not checked yet, or waiting for a retry. verified: the bytes match the
        declared sha256 and size, or nothing was declared. mismatch: the declared sha256 or
        size differs. failed: the bytes could not be read.
      enum: [pending, verified, mismatch, failed]
      x-enum-varnames:
        [
          ArtifactChecksumStatusPending,
          ArtifactChecksumStatusVerified,
          ArtifactChecksumStatusMismatch,
          ArtifactChecksumStatusFailed,
        ]

    ArtifactChecksumCopyStatus:
      type: string
      description: >-
        copied: our copy of the external file is at stored_uri. own_storage: the file is in our
        storage already, so it needs no copy. over_limit: the external file is larger than the
        copy limit, so only its link is kept. mismatch: the bytes differ from the declared sha256
        or size, so no copy is kept. copy_failed: the copy could not be stored. copy_off:
        copying external files is turned off.
      enum: [copied, own_storage, over_limit, mismatch, copy_failed, copy_off]
      x-enum-varnames:
        [
          ArtifactChecksumCopyStatusCopied,
          ArtifactChecksumCopyStatusOwnStorage,
          ArtifactChecksumCopyStatusOverLimit,
          ArtifactChecksumCopyStatusMismatch,
          ArtifactChecksumCopyStatusCopyFailed,
          ArtifactChecksumCopyStatusCopyOff,
        ]

