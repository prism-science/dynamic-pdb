            type: string
            pattern: "^[A-Z][1-9][0-9]*[A-Z]$"
        source_organisms:
          type: array
          items:
            $ref: "#/components/schemas/PolymerEntityOrganism"

    ArtifactLevel:
      type: string
      enum: [L0, L1, L2, L3]

    ArtifactType:
      type: string
      enum: [model, structure_factors, fasta, other]
      x-enum-varnames:
        [ArtifactTypeModel, ArtifactTypeStructureFactors, ArtifactTypeFASTA, ArtifactTypeOther]

    RunArtifactDirection:
