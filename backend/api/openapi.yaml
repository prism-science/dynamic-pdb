      required: [type, id]
      properties:
        type:
          type: string
          enum: [artifacts]
        id:
          type: string
          format: uuid

    ModelAttributes:
      type: object
      required: [id, entry_id, created_by, title, metadata, created_at, updated_at, metrics]
      properties:
        id:
