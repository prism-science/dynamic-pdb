          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the entries
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Entries with matching revisions found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryRevisionGroupCollectionDocument"
        "400":
          description: Missing or invalid state filter, or invalid cursor.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/revisions:
    get:
      tags: [Users]
      operationId: listUserEntryRevisionsForEntry
      summary: List entry revisions
      description: >
        Lists the path user's revisions of one entry. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: >
            Deprecated: use `cursor`. Number of revisions to skip. Deep offsets get slower
            and can skip or repeat rows while data changes.
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the revisions
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Entry revisions found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryRevisionSummaryCollectionDocument"
        "400":
          description: Invalid cursor.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/revisions/{revision_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      operationId: getUserEntryRevision
      summary: Get entry revision
      description: >
        Returns a revision created by the path user. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entry revision found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryRevisionDocument"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry revision not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/models/{model_id}/revisions:
    get:
      tags: [Users]
      operationId: listUserModelRevisionsForModel
      summary: List model revisions
      description: >
        Lists the path user's revisions of one model. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: >
            Deprecated: use `cursor`. Number of revisions to skip. Deep offsets get slower
            and can skip or repeat rows while data changes.
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the revisions
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Model revisions found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelRevisionSummaryCollectionDocument"
        "400":
          description: Invalid cursor.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/models/{model_id}/revisions/{revision_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      operationId: getUserModelRevision
      summary: Get model revision
      description: >
        Returns a revision created by the path user. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model revision found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelRevisionDocument"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model revision not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Users]
      operationId: submitUserModelRevision
      summary: Submit model revision
      description: >
        The authenticated user ID must equal `user_id`. Changes a pending or
        rejected model revision to `in_review`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/SubmitRevisionRequest"
      responses:
        "200":
          description: Model revision updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelRevisionDocument"
        "400":
          description: Invalid state transition.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id or own the revision.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model revision not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Model revision is not editable.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            A database check refused the change (code `CONSTRAINT_VIOLATION`). The error
            names the check and has no source.pointer.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorObject"

    ErrorObject:
      type: object
      required: [status]
      properties:
        status:
          type: string
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        source:
          $ref: "#/components/schemas/ErrorSource"

    ErrorSource:
      type: object
      required: [pointer]
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON pointer to the request field the error is about, for example /model/metrics/0/key.

    ProbeMeta:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ProbeDocument:
      type: object
      required: [meta]
      properties:
        meta:
          $ref: "#/components/schemas/ProbeMeta"

    TokenDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TokenData"

    TokenData:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
        attributes:
          $ref: "#/components/schemas/TokenAttributes"

    FileUploadGrantDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FileUploadGrantData"

    FileUploadGrantData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/FileUploadGrantAttributes"

    CompleteFileUploadDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CompleteFileUploadData"

    CompleteFileUploadData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/CompleteFileUploadAttributes"

    EntryCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EntryInfoData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/CursorPageMeta"

    CollectionLinks:
      type: object
      description: Present only when another page exists.
      required: [next]
      properties:
        next:
          type: string
          description: Absolute URL of the next page, with the same filters and limit.

    CursorPageMeta:
      type: object
      description: Present only when another page exists.
      required: [next_cursor]
      properties:
        next_cursor:
          type: string
          description: Pass as `cursor` to get the next page.

    EntryInfoData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/EntryInfoAttributes"

    SimilarEntryCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SimilarEntryData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/SimilarEntryCollectionMeta"

    SimilarEntryData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SimilarEntryAttributes"

    SimilarEntryCollectionMeta:
      type: object
      properties:
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        next_cursor:
          type: string
          description: Present only when another page exists. Pass as `cursor` to get the next page.

    ModelCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/CursorPageMeta"

    ModelSearchCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelSearchData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/ModelSearchCollectionMeta"

    ModelSearchData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/ModelSearchAttributes"

    ModelSearchAttributes:
      allOf:
        - $ref: "#/components/schemas/ModelAttributes"
        - type: object
          properties:
            entry:
              description: >
                The model's entry, from its active revision, with its related raw datasets.
                Present where the server enables model search.
              allOf:
                - $ref: "#/components/schemas/EntryInfoAttributes"
            review_flags:
              description: >
                Open review flags on the model, its current revision, its entry or the entry's
                polymer entities. The record stays public; show the flags as a warning. Present
                (possibly empty) where the server enables model search.
              type: array
              items:
                $ref: "#/components/schemas/ReviewFlag"
            compounds_needing_review:
              description: >
                Compounds named in the compound filter that the coordinate-file reader marked
                "needs review" in this model's file (for example a possible chain residue).
                They still match. Present only when the request has a compound filter.
              type: array
              items:
                $ref: "#/components/schemas/CompoundNeedingReview"

    ReviewFlag:
      type: object
      required: [object_type, object_id, issue, flagged_at]
      properties:
        object_type:
          type: string
          description: What the flag is on, for example entry, model, model_revision or polymer_entity.
        object_id:
          type: string
        issue:
          type: string
          description: The open issue, for example sync_validation_failed.
        flagged_at:
          type: string
          format: date-time

    CompoundNeedingReview:
      type: object
      required: [ccd_id, review_reason]
      properties:
        ccd_id:
          type: string
        review_reason:
          type: string

    ModelSearchCollectionMeta:
      type: object
      properties:
        next_cursor:
          type: string
          description: Present only when another page exists. Pass as `cursor` to get the next page.
        total:
          $ref: "#/components/schemas/ModelSearchTotal"

    ModelSearchTotal:
      type: object
      description: >
        How many models match the whole search. Present on the first page (a request without
        cursor or offset) where the server enables model search.
      required: [count, exact]
      properties:
        count:
          type: integer
          minimum: 0
          description: >
            The number of matching models when exact is true. When exact is false, more than
            this many models match (show "10,000+" for a count of 10000).
        exact:
          type: boolean

    ModelSearchSource:
      type: string
      enum: [pdb_archive, dynamic_pdb_deposit]
      x-enum-varnames: [ModelSearchSourcePDBArchive, ModelSearchSourceDynamicPDBDeposit]

    ProteinChainMode:
      type: string
      enum: [at_least, every]
      x-enum-varnames: [ProteinChainModeAtLeast, ProteinChainModeEvery]

    CreateSelectionRequest:
      type: object
      description: >
        Which models to save. Give model_ids, searches, or both; exclude_model_ids removes
        models from the result.
      properties:
        model_ids:
          type: array
          description: >
            Models to hold, by model ID. Each must be a published model of a published entry.
          maxItems: 10000
          items:
            type: string
            minLength: 1
            maxLength: 100
        searches:
          type: array
          description: >
            Searches whose every result the selection holds. Each is the query string of a
            GET /v1/models request (the part after "?"), with its filters only: no limit, offset
            or cursor. An empty string holds every model. Filters work where the server enables
            model search, and the protein chain filters where it also enables them, as on
            GET /v1/models.
          maxItems: 10
          items:
            type: string
            maxLength: 8192
        exclude_model_ids:
          type: array
          description: Models to leave out, by model ID. IDs of no model are ignored.
          maxItems: 10000
          items:
            type: string
            minLength: 1
            maxLength: 100

    SelectionDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SelectionData"

    SelectionData:
      type: object
      required: [type, id, attributes, links]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SelectionAttributes"
        links:
          $ref: "#/components/schemas/SelectionLinks"

    SelectionAttributes:
      type: object
      required: [model_count, entry_count, created_at, request]
      properties:
        model_count:
          type: integer
          minimum: 1
          description: How many models the selection holds.
        entry_count:
          type: integer
          minimum: 1
          description: How many entries the selection's models belong to.
        created_at:
          type: string
          format: date-time
          description: When the selection was saved; its revisions are the ones active then.
        request:
          $ref: "#/components/schemas/SelectionRequest"

    SelectionRequest:
      type: object
      description: >
        What was asked for when the selection was saved: model IDs trimmed and listed once, each
        search's parameters in a fixed order.
      required: [model_ids, searches, exclude_model_ids]
      properties:
        model_ids:
          type: array
          items:
            type: string
        searches:
          type: array
          items:
            type: string
        exclude_model_ids:
          type: array
          items:
            type: string

    SelectionLinks:
      type: object
      required: [self, models]
      properties:
        self:
          type: string
          description: Absolute URL of the selection.
        models:
          type: string
          description: Absolute URL of the selection's models with their frozen revisions.

    SelectionModelCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SelectionModelData"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/CursorPageMeta"

    SelectionModelData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
          description: The model ID.
        attributes:
          $ref: "#/components/schemas/SelectionModelAttributes"

    SelectionModelAttributes:
      type: object
      required: [model_id, entry_id, model_revision_number, entry_revision_number]
      properties:
        model_id:
          type: string
        entry_id:
          type: string
        model_revision_number:
          type: integer
          description: >
            Number of the model revision frozen in the selection (revision_number of the model
            as it was then).
        entry_revision_number:
          type: integer
          description: >
            Number of the entry revision frozen in the selection (revision_number of the entry
            as it was then).

    ModelDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ModelDetailData"

    ModelDetailData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/ModelDetailAttributes"

    ModelDetailAttributes:
      description: >
        A model as the model detail endpoint returns it: the list attributes plus where the
        values of its archive-synced fields came from, the compounds its file models, and the
        information it lacks.
      allOf:
        - $ref: "#/components/schemas/ModelAttributes"
        - type: object
          required: [field_sources, modeled_compounds]
          properties:
            field_sources:
              $ref: "#/components/schemas/FieldSources"
            modeled_compounds:
              $ref: "#/components/schemas/ModeledCompounds"
            missing_info:
              description: >
                What this record lacks that a write would now be rejected for. Such records
                stay public; the website labels them "information missing". Empty when nothing
                is missing; omitted when it could not be worked out.
              type: array
              items:
                $ref: "#/components/schemas/MissingInfo"

    MissingInfo:
      type: object
      required: [kind]
      description: >
        One piece of information a model lacks. metric_software: a metric of a computed model
        names neither its software nor the run that produced it (metric_id is set).
        run_software_version: a run of a computed model has no software version (run_id is
        set). model_run: a computed model has no run.
      properties:
        kind:
          $ref: "#/components/schemas/MissingInfoKind"
        metric_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid

    MissingInfoKind:
      type: string
      enum: [metric_software, run_software_version, model_run]
      x-enum-varnames: [MissingInfoKindMetricSoftware, MissingInfoKindRunSoftwareVersion, MissingInfoKindModelRun]

    ModeledCompounds:
      type: object
      description: >
        Every copy of every compound the model's file models outside its polymer chains, water
        excepted, read by the server from the stored file (for an archive model, from its copy
        of the RCSB file). Read-only: buffers are kept and no reference-list rule is applied; the
        entry's ligands and cofactors carry those judgments. status: not_stored (the server
        reads nothing from the model's file: it is not in our bucket and no copy of it was taken
        for reading, so the typed metadata ligands and cofactors stand), pending (not read yet,
        or waiting for a retry), done, failed (last_error says why). copies is empty unless
        status is done.
      required: [status, warnings, copies]
      properties:
        status:
          type: string
          enum: [not_stored, pending, done, failed]
        parser_version:
          type: string
          nullable: true
          description: The version of the parser that read the file, when status is done.
        complete:
          type: boolean
          nullable: true
          description: False when a limit stopped the list, so copies may be missing.
        warnings:
          type: array
          items:
            type: string
        last_error:
          type: string
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        copies:
          type: array
          description: In CCD ID order, then by chain and residue number.
          items:
            $ref: "#/components/schemas/ModeledCompoundCopy"

    ModeledCompoundCopy:
      type: object
      description: >
        One copy of a compound in the model's file. auth_asym_id, auth_seq_id and pdb_ins_code
        are the chain, residue number and insertion code viewers show; label_asym_id and
        entity_id are null for a PDB-format file.
      required: [ccd_id, source, needs_review]
      properties:
        ccd_id:
          type: string
        label_asym_id:
          type: string
          nullable: true
        auth_asym_id:
          type: string
          nullable: true
        auth_seq_id:
          type: string
          nullable: true
        pdb_ins_code:
          type: string
          nullable: true
        entity_id:
          type: string
          nullable: true
        source:
          type: string
          enum: [nonpoly_scheme, branch_scheme, atom_site, pdb_hetatm]
          description: >
            Where the copy was read: an mmCIF scheme category, the mmCIF coordinates, or the
            HETATM records of a PDB-format file.
        needs_review:
          type: boolean
          description: >
            Set when the file cannot tell whether the residue is a compound at all, for example
            a file without SEQRES or _entity, where it could be a chain residue.
        review_reason:
