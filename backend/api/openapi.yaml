openapi: 3.0.3
info:
  title: dynamic-pdb backend API
  version: 0.0.0

paths:
  /livez:
    get:
      operationId: livez
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /v1/auth/github/exchange:
    post:
      operationId: exchangeGithubToken
      summary: Exchange a GitHub access token for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub access token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/github/code/exchange:
    post:
      operationId: exchangeGithubCode
      summary: Exchange a GitHub authorization code for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubCodeExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub authorization code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files:
    post:
      operationId: createFileUpload
      summary: Create a file upload and presign its parts
      description: >
        Creates a multipart upload and returns a presigned PUT URL for every
        part. The client uploads each part, then calls the complete endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileUploadRequest"
      responses:
        "200":
          description: File upload created; presigned part URLs returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadGrantResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/files/complete:
    post:
      operationId: completeFileUpload
      summary: Complete a file upload
      description: >
        Assembles the uploaded parts into the final object. The client sends the
        part number and ETag returned by each part upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteFileUploadRequest"
      responses:
        "200":
          description: File upload completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteFileUploadResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/abort:
    post:
      operationId: abortFileUpload
      summary: Abort a file upload
      description: Cancels an in-progress file upload and discards any parts already uploaded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortFileUploadRequest"
      responses:
        "204":
          description: File upload aborted.
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries:
    get:
      operationId: listEntries
      summary: List entries
      description: Lists entries from their current approved, non-deleted revisions.
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of entries to skip.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: query
          in: query
          description: Text to search across entries, models, artifacts, and artifact metadata.
          required: false
          schema:
            type: string
        - name: pdb_id
          in: query
          description: PDB IDs to match against entry metadata.external_refs.pdb.
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: Entries found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createEntry
      summary: Create an entry and its initial revision
      description: >
        Atomically creates a new entry, its initial draft revision, and any
        models supplied as add operations.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "201":
          description: Entry and initial draft revision created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEntryRevisionResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry with the same active PDB reference already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}:
    get:
      operationId: getEntry
      summary: Get entry
      description: Returns the current approved, non-deleted revision of an entry.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entry found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/similar-entries:
    get:
      operationId: listSimilarEntries
      summary: List entries with similar protein sequences
      description: Lists similar entries from their current approved, non-deleted revisions.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Source entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of similar entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of similar entries to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Similar entries found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarEntryListResponse"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models:
    get:
      operationId: listModels
      summary: List models
      description: Lists non-deleted models from the entry's current approved revision.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of models to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of models to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Models found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}:
    get:
      operationId: getModel
      summary: Get model
      description: Returns a non-deleted model from the entry's current approved revision.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Model found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/artifacts:
    get:
      operationId: listArtifacts
      summary: List artifacts
      description: Lists artifacts from the entry's current approved revision.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: levels
          in: query
          description: Artifact levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArtifactLevel"
        - name: limit
          in: query
          description: Maximum number of artifacts to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of artifacts to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Artifacts found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}/artifacts:
    get:
      operationId: listModelArtifacts
      summary: List model artifacts
      description: Lists artifacts from a model in the entry's current approved revision.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: levels
          in: query
          description: Artifact levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArtifactLevel"
        - name: limit
          in: query
          description: Maximum number of artifacts to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of artifacts to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Model artifacts found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelArtifactListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/revisions:
    get:
      operationId: listEntryRevisions
      summary: List entry revisions
      description: Administrator-only collection of entry revisions.
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          description: Revision state to list.
          required: true
          schema:
            $ref: "#/components/schemas/RevisionState"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entry revisions found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryRevisionListResponse"
        "400":
          description: Missing or invalid state filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/revisions:
    get:
      operationId: listEntryRevisionsForEntry
      summary: List revisions of an entry
      description: Administrator-only revision history of one entry.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entry revisions found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryRevisionListResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createEntryRevision
      summary: Create an entry revision
      description: >
        Atomically creates a draft entry revision containing the entry field
        changes and the ordered model operations in the request. No partial
        revision is created when any operation fails.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryRevisionRequest"
      responses:
        "201":
          description: Draft entry revision created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEntryRevisionResponse"
        "400":
          description: Invalid entry change or model operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller cannot create revisions for this entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Revision conflicts with the current published revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/revisions/{revision_id}:
    parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEntryRevision
      summary: Get an entry revision
      description: Administrator-only access to a specific entry revision.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entry revision found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryRevision"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry revision not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateEntryRevisionState
      summary: Approve or reject an entry revision
      description: >
        Administrator-only. Changes an in-review revision to approved or
        rejected. A comment is required when rejecting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRevisionRequest"
      responses:
        "200":
          description: Entry revision updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryRevision"
        "400":
          description: Invalid state transition or missing rejection comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry revision not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry revision changed since it was loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}/revisions:
    get:
      operationId: listModelRevisionsForModel
      summary: List revisions of a model
      description: Administrator-only revision history of one model.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Model revisions found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRevisionListResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}/revisions/{revision_id}:
    parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getModelRevision
      summary: Get a model revision
      description: Administrator-only access to a specific model revision.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model revision found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRevision"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model revision not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/{user_id}/entries/revisions:
    get:
      operationId: listUserEntryRevisions
      summary: List a user's entry revisions
      description: >
        Lists revisions created by the path user. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          description: Revision state to list.
          required: true
          schema:
            $ref: "#/components/schemas/RevisionState"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entry revisions found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryRevisionListResponse"
        "400":
          description: Missing or invalid state filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/revisions:
    get:
      operationId: listUserEntryRevisionsForEntry
      summary: List a user's revisions of an entry
      description: >
        Lists the path user's revisions of one entry. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entry revisions found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryRevisionListResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/revisions/{revision_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUserEntryRevision
      summary: Get a user's entry revision
      description: >
        Returns a revision created by the path user. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entry revision found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryRevision"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry revision not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: submitUserEntryRevision
      summary: Submit a user's entry revision
      description: >
        The authenticated user ID must equal `user_id`. Changes a draft or
        rejected revision to `in_review`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRevisionRequest"
      responses:
        "200":
          description: Entry revision updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryRevision"
        "400":
          description: Invalid state transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id or own the revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry revision not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry revision is not editable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/models/{model_id}/revisions:
    get:
      operationId: listUserModelRevisionsForModel
      summary: List a user's revisions of a model
      description: >
        Lists the path user's revisions of one model. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Model revisions found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRevisionListResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{user_id}/entries/{entry_id}/models/{model_id}/revisions/{revision_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUserModelRevision
      summary: Get a user's model revision
      description: >
        Returns a revision created by the path user. The authenticated user ID
        must equal `user_id`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model revision found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRevision"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user does not match user_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model revision not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CreateFileUploadRequest:
      type: object
      required: [entry_id, artifact_id, filename, size]
      properties:
        entry_id:
          type: string
          format: uuid
          description: Entry identifier that owns this file.
        model_id:
          type: string
          format: uuid
          nullable: true
          description: Model identifier for model-level files; null for entry-level files.
        artifact_id:
          type: string
          format: uuid
          description: Artifact identifier this file belongs to.
        filename:
          type: string
          minLength: 1
          description: Original filename to keep as the final object key suffix.
        size:
          type: integer
          format: int64
          description: Total size in bytes of the file to upload.

    FileUploadGrantResponse:
      type: object
      required: [key, upload_id, object_url, part_size, parts]
      properties:
        key:
          type: string
          description: Object key the assembled file will be stored under.
        upload_id:
          type: string
          description: Identifier of the initiated multipart upload; echoed back on complete and abort.
        object_url:
          type: string
          description: Public HTTP object URL to store with the artifact.
        part_size:
          type: integer
          format: int64
          description: Size in bytes of every part except the last; the client must slice the file at this boundary.
        parts:
          type: array
          description: Presigned PUT targets, one per part, in ascending part-number order.
          items:
            $ref: "#/components/schemas/FileUploadPart"

    FileUploadPart:
      type: object
      required: [part_number, url]
      properties:
        part_number:
          type: integer
          description: 1-based index of this part.
        url:
          type: string
          description: Presigned URL the client PUTs this part's bytes to.

    CompleteFileUploadRequest:
      type: object
      required: [key, upload_id, parts]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.
        parts:
          type: array
          description: The uploaded parts, each with the ETag object storage returned for it.
          items:
            $ref: "#/components/schemas/CompletedFileUploadPart"

    CompletedFileUploadPart:
      type: object
      required: [part_number, etag]
      properties:
        part_number:
          type: integer
          description: 1-based index of the part.
        etag:
          type: string
          description: ETag returned in the response header when the part was uploaded.

    CompleteFileUploadResponse:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Object key the completed file is stored under.

    AbortFileUploadRequest:
      type: object
      required: [key, upload_id]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.

    GitHubExchangeRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    GitHubCodeExchangeRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
        redirect_uri:
          type: string

    TokenResponse:
      type: object
      required: [token_type, access_token, expires_at, name, email, login]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
        login:
          type: string

    EntryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntryInfo"

    EntryInfo:
      type: object
      required: [id, created_by, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SimilarEntryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SimilarEntry"
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0

    SimilarEntry:
      type: object
      required: [entry, score, matches]
      properties:
        entry:
          $ref: "#/components/schemas/EntryInfo"
        score:
          type: number
          format: double
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ProteinSequenceSimilarityMatch"

    ProteinSequenceSimilarityMatch:
      type: object
      required: [source_sequence_id, similar_sequence, score, tool, metadata, created_at]
      properties:
        source_sequence_id:
          type: string
          format: uuid
        similar_sequence:
          $ref: "#/components/schemas/ProteinSequence"
        score:
          type: number
          format: double
        tool:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    CreateEntryRequest:
      type: object
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/CreateEntryData"
        model_operations:
          type: array
          description: Only add operations are valid for a new entry.
          items:
            $ref: "#/components/schemas/AddModelOperation"

    CreateEntryData:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"

    Entry:
      type: object
      required: [id, created_by, name, metadata, created_at, updated_at, protein_sequences]
      properties:
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        protein_sequences:
          type: array
          items:
            $ref: "#/components/schemas/ProteinSequence"

    ModelListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    Model:
      type: object
      required: [id, entry_id, created_by, name, metadata, created_at, updated_at, metrics]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"

    ArtifactLevel:
      type: string
      enum: [L0, L1, L2, L3]

    RunArtifactDirection:
      type: string
      enum: [input, output]

    CreateArtifactRequest:
      type: object
      required: [id, name, level]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        level:
          $ref: "#/components/schemas/ArtifactLevel"
        uri:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    Artifact:
      type: object
      required: [id, name, level, metadata, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          $ref: "#/components/schemas/ArtifactLevel"
        uri:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    ArtifactListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"

    ModelArtifactListResponse:
      type: object
      required: [items, runs, relations]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/RunArtifact"

    CreateRunRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        software_name:
          type: string
          nullable: true
        software_version:
          type: string
          nullable: true
        command:
          type: string
          nullable: true
        parameters:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateRunArtifactRequest"

    Run:
      type: object
      required: [id, name, parameters, metadata, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        software_name:
          type: string
          nullable: true
        software_version:
          type: string
          nullable: true
        command:
          type: string
          nullable: true
        parameters:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRunArtifactRequest:
      type: object
      required: [artifact_id, direction]
      properties:
        artifact_id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/RunArtifactDirection"
        position:
          type: integer
          nullable: true

    RunArtifact:
      type: object
      required: [run_id, artifact_id, direction]
      properties:
        run_id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/RunArtifactDirection"
        position:
          type: integer
          nullable: true

    CreateMetricRequest:
      type: object
      required: [id, key, value]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          minLength: 1
        value:
          type: number
          format: double

    Metric:
      type: object
      required: [id, key, value, created_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        value:
          type: number
          format: double
        created_at:
          type: string
          format: date-time

    ProteinSequence:
      type: object
      required: [id, source_artifact_id, record_index, header, sequence, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_artifact_id:
          type: string
          format: uuid
        record_index:
          type: integer
          minimum: 0
        header:
          type: string
        sequence:
          type: string
        created_at:
          type: string
          format: date-time

    RevisionState:
      type: string
      enum: [draft, in_review, approved, rejected]

    EntryState:
      type: string
      enum: [active, deleted]

    ModelState:
      type: string
      enum: [active, deleted]

    CreateEntryRevisionRequest:
      type: object
      description: >
        Entry changes and ordered model operations applied atomically while
        creating a draft revision. At least one of `entry` or
        `model_operations` must be present.
      anyOf:
        - required: [entry]
        - required: [model_operations]
      properties:
        entry:
          $ref: "#/components/schemas/EntryRevisionChange"
        model_operations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ModelOperation"

    EntryRevisionChange:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        state:
          $ref: "#/components/schemas/EntryState"
          description: Entry state after this revision is approved.

    ModelOperation:
      oneOf:
        - $ref: "#/components/schemas/AddModelOperation"
        - $ref: "#/components/schemas/UpdateModelOperation"
        - $ref: "#/components/schemas/RemoveModelOperation"
      discriminator:
        propertyName: op
        mapping:
          add: "#/components/schemas/AddModelOperation"
          update: "#/components/schemas/UpdateModelOperation"
          remove: "#/components/schemas/RemoveModelOperation"

    AddModelOperation:
      type: object
      required: [op, data]
      properties:
        op:
          type: string
          enum: [add]
        data:
          $ref: "#/components/schemas/AddModelData"

    AddModelData:
      type: object
      required: [name]
      properties:
        model_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CreateRunRequest"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/CreateMetricRequest"

    UpdateModelOperation:
      type: object
      required: [op, data]
      properties:
        op:
          type: string
          enum: [update]
        data:
          $ref: "#/components/schemas/UpdateModelData"

    UpdateModelData:
      type: object
      required: [model_id]
      minProperties: 2
      properties:
        model_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        artifacts:
          type: array
          description: Replaces the model revision's artifact set when present.
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        runs:
          type: array
          description: Replaces the model revision's run set when present.
          items:
            $ref: "#/components/schemas/CreateRunRequest"
        metrics:
          type: array
          description: Replaces the model revision's metric set when present.
          items:
            $ref: "#/components/schemas/CreateMetricRequest"

    RemoveModelOperation:
      type: object
      required: [op, data]
      properties:
        op:
          type: string
          enum: [remove]
        data:
          $ref: "#/components/schemas/RemoveModelData"

    RemoveModelData:
      type: object
      required: [model_id]
      properties:
        model_id:
          type: string
          format: uuid

    SubmitRevisionRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [in_review]

    CreateEntryRevisionResponse:
      type: object
      required: [entry_id, revision_id, state, model_results]
      properties:
        entry_id:
          type: string
          format: uuid
        revision_id:
          type: string
          format: uuid
        base_revision_id:
          type: string
          format: uuid
          nullable: true
        state:
          type: string
          enum: [draft]
        model_results:
          type: array
          description: Results in the same order as the requested model operations.
          items:
            $ref: "#/components/schemas/ModelOperationResult"

    ModelOperationResult:
      type: object
      required: [op, model_id, model_revision_id]
      properties:
        op:
          type: string
          enum: [add, update, remove]
        model_id:
          type: string
          format: uuid
        model_revision_id:
          type: string
          format: uuid

    ReviewRevisionRequest:
      type: object
      description: >
        Administrator decision for an in-review revision. `comment` is required
        when state is `rejected`.
      required: [state]
      properties:
        state:
          type: string
          enum: [approved, rejected]
        comment:
          type: string
          nullable: true

    EntryRevisionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntryRevisionSummary"

    ModelRevisionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelRevisionSummary"

    EntryRevisionSummary:
      type: object
      required: [id, entry_id, state, entry_state, created_by, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Entry revision ID.
        entry_id:
          type: string
          format: uuid
        parent_revision_id:
          type: string
          format: uuid
          nullable: true
        revision_number:
          type: integer
          minimum: 1
          nullable: true
        state:
          $ref: "#/components/schemas/RevisionState"
        entry_state:
          $ref: "#/components/schemas/EntryState"
        created_by:
          type: string
          format: uuid
        name:
          type: string
        review_comment:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ModelRevisionSummary:
      type: object
      required: [id, entry_id, entry_revision_id, model_id, model_state, created_by, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Model revision ID.
        entry_id:
          type: string
          format: uuid
        entry_revision_id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
        parent_revision_id:
          type: string
          format: uuid
          nullable: true
        revision_number:
          type: integer
          minimum: 1
          nullable: true
        model_state:
          $ref: "#/components/schemas/ModelState"
        created_by:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EntryRevision:
      allOf:
        - $ref: "#/components/schemas/EntryRevisionSummary"
        - type: object
          required: [metadata, protein_sequences, artifacts, models]
          properties:
            description:
              type: string
              nullable: true
            thumbnail_image_url:
              type: string
              nullable: true
            metadata:
              type: object
              additionalProperties: true
            protein_sequences:
              type: array
              items:
                $ref: "#/components/schemas/ProteinSequence"
            artifacts:
              type: array
              items:
                $ref: "#/components/schemas/Artifact"
            models:
              type: array
              description: Model revisions changed as part of this entry revision.
              items:
                $ref: "#/components/schemas/ModelRevision"

    ModelRevision:
      allOf:
        - $ref: "#/components/schemas/ModelRevisionSummary"
        - type: object
          required: [metadata, metrics, artifacts]
          properties:
            description:
              type: string
              nullable: true
            thumbnail_image_url:
              type: string
              nullable: true
            primary_artifact_id:
              type: string
              format: uuid
              nullable: true
            metadata:
              type: object
              additionalProperties: true
            metrics:
              type: array
              items:
                $ref: "#/components/schemas/Metric"
            artifacts:
              type: array
              items:
                $ref: "#/components/schemas/Artifact"
