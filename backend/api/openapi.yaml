openapi: 3.0.3
info:
  title: Dynamic PDB API
  version: 1.0.0
  description: |
    Dynamic PDB exposes deposited structural biology data, derived models, the
    programs that produced them, and evaluation metrics through a versioned
    JSON:API interface.

    Published entries can be read without authentication. Mutating operations —
    including deposits, model submissions, and review decisions — require a
    bearer token obtained through GitHub sign-in.

    Every request and response is a JSON:API document: send and accept
    `application/vnd.api+json`.
servers:
  - url: https://dynamicpdb.com/api
    description: Production

tags:
  - name: Entries
    description: |
      An entry groups the raw data, the models built from it, and the metrics
      measured against them. Reads return the current active revision.
  - name: Models
    description: |
      Structural models produced outside the registry, each carrying its
      quality scores as a flat list of key and value.
  - name: Revisions
    description: Revision queues, diffs, and review decisions. Reviewer role only.
  - name: Files
    description: |
      Multipart upload. Bytes never pass through the API — the client
      presigns, PUTs each part, then completes or aborts the upload.
  - name: Users
    description: Your own revisions and the state review left them in.
  - name: Authentication
    description: Exchanging a GitHub authorization for a backend JWT.
  - name: Artifacts
    description: Reading values out of uploaded artifact files.
  - name: Archive
    description: Looking up what the PDB archive says about an entry before it is imported.
  - name: Selections
    description: |
      Frozen selections of models: saved with the revisions they had then, public by their
      random ID. Downloads use them.
  - name: Health
    x-scalar-ignore: true
    description: Liveness and readiness probes.

paths:
  /openapi.yaml:
    get:
      tags: [Health]
      operationId: getOpenAPISpec
      summary: OpenAPI description
      x-scalar-ignore: true
      responses:
        "200":
          description: OpenAPI description.
          content:
            application/yaml:
              schema:
                type: string

  /livez:
    get:
      tags: [Health]
      operationId: livez
      x-scalar-ignore: true
      responses:
        "200":
          description: Service is alive.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProbeDocument"

  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      x-scalar-ignore: true
      responses:
        "200":
          description: Service is ready.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProbeDocument"
        "503":
          description: Service is not ready.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProbeDocument"

  /v1/auth/github/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeGithubToken
      summary: Exchange GitHub token
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/GitHubExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub access token is invalid or expired.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/github/code/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeGithubCode
      summary: Exchange GitHub code
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/GitHubCodeExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub authorization code is invalid or expired.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/archive/pdb/{pdb_id}:
    get:
      tags: [Archive]
      operationId: getArchivePdb
      summary: Look up a PDB entry in the archive
      description: |
        Reads a PDB entry from RCSB and returns the values Dynamic PDB would
        store for the entry, its model, and its polymer entities, each with the
        RCSB field it was read from. Nothing is stored.

        The proposed values are checked with the same schema rules as writes.
        Violations, conflicting RCSB records, and values that were dropped come
        back as `warnings` — the lookup does not fail because of them.
        Responses are cached for a few minutes and RCSB is given 10 seconds.
      security:
        - bearerAuth: []
      parameters:
        - name: pdb_id
          in: path
          description: Four-character PDB ID, for example `4HHB`. Case is ignored.
          required: true
          schema:
            type: string
            pattern: "^[0-9][A-Za-z0-9]{3}$"
      responses:
        "200":
          description: Proposed values for the PDB entry.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ArchivePdbDocument"
        "400":
          description: The PDB ID is malformed.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: RCSB has no such entry.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: RCSB failed or did not answer in time.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/artifacts/{id}/extract:
    post:
      tags: [Artifacts]
      operationId: extractArtifact
      summary: Extract values from an uploaded structure file
      description: |
        Reads the start of the artifact's uploaded mmCIF file and returns the
        values Dynamic PDB would store for it: atom count, modeled residues,
        protein chains, altloc fraction, ligands, cofactors, engineered
        mutations and the refinement program. It also returns the rule that
        placed each compound (`compound_sources`, including the compounds left
        out) and the WURCS descriptor of each glycan (`glycan_descriptors`).
        Nothing is stored.

        Only the first 4 MiB of the object is read (a ranged S3 GET). When the
        coordinates run past the limit, the values that need every atom are left
        out and a warning says so. Archive files do not write their categories in
        a fixed order, so the depositor flags, modified residues or glycan
        descriptors of a larger file can also fall past the limit: the rules they
        feed are then not applied, and one warning names each such category.

        Every value carries `source: file:<sha256>` of the artifact. Values
        that cannot be extracted, or fail the schema rules, come back as
        `warnings`; the request does not fail because of them. Values the
        parser is unsure about, such as metal ions in a file without `metalc`
        rows, are returned with `needs_review: true`.

        The reference lists in `lib/cif` are approved by researchers: solvents
        and buffers are left out of `ligands`, and sulfate, phosphate, citrate
        and halides are kept and flagged `needs_review`. While a future list
        version is a draft, only water is left out and every response carries a
        warning saying so.

        Parsing has a time budget of 5 seconds per request. If it runs out, the
        response is still 200: the values found so far come back with the warning
        `parser limit: time budget exceeded: the rest of the file was not read`,
        and the values that need the whole file (atom count, modeled residues,
        protein chains, altloc fraction) are left out, as for a truncated read.
        The extraction slot is released either way.

        Allowed for the user who created the artifact and for reviewers. Each
        user may make 10 extraction requests per minute and each server instance
        runs at most 2 extractions at once; past those limits the response is
        429 or 503 with a `Retry-After` header.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Artifact ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Extracted values.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ArtifactExtractionDocument"
              example:
                data:
                  type: artifact_extractions
                  id: 6f1c2a9e-3b4d-4c5e-8f7a-1b2c3d4e5f60
                  attributes:
                    source: "file:3b2a8f0c9d1e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f90"
                    reference_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"
                    bytes_read: 100352
                    object_size: 100352
                    truncated: false
                    values:
                      - name: ligands
                        value:
                          - {id: BMA}
                          - {id: NAG}
                          - {id: SO4, needs_review: true, review_reason: "often from the buffer: confirm it is part of the sample"}
                        source: "file:3b2a8f0c9d1e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f90"
                        needs_review: true
                        review_reason: "often from the buffer: confirm it is part of the sample"
                      - name: compound_sources
                        value:
                          ligands:
                            BMA: {rule: branched, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}
                            NAG: {rule: branched, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}
                            SO4: {rule: list, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}
                          cofactors: {}
                          excluded:
                            GOL: {rule: list, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}
                        source: "file:3b2a8f0c9d1e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f90"
                        needs_review: false
                      - name: glycan_descriptors
                        value:
                          - entity_id: "2"
                            compound_ids: [BMA, NAG]
                            descriptors:
                              - descriptor: "WURCS=2.0/2,3,2/[a2122h-1b_1-5_2*NCC/3=O][a1122h-1b_1-5]/1-1-2/a4-b1_b4-c1"
                                type: WURCS
                                program: PDB2Glycan
                                program_version: "1.1.0"
                        source: "file:3b2a8f0c9d1e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f90"
                        needs_review: false
                    warnings: []
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller neither created the artifact nor is a reviewer.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Artifact not found, or nothing is stored at its URI.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The artifact is not an uploaded mmCIF file with a sha256.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The user made too many extraction requests in the last minute. `Retry-After` gives seconds.
          headers:
            Retry-After:
              description: Seconds to wait before extracting again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The object could not be read from storage.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Every extraction slot of this server instance is busy. `Retry-After` gives seconds.
          headers:
            Retry-After:
              description: Seconds to wait before extracting again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/extract:
    post:
      tags: [Files]
      operationId: extractUploadedFile
      summary: Extract values from an uploaded mmCIF before it is saved
      description: |
        The same extraction as `POST /v1/artifacts/{id}/extract`, for a file the
        deposition forms have uploaded (`POST /v1/files`) but not yet saved as an
        artifact: the forms create artifacts only when the entry or model is
        submitted, and show the extracted values before that. The object is named
        by the artifact ID it was uploaded under and the `object_url` the upload
        returned; it must lie in that artifact's folder. Nothing is stored.

        Every value carries `source: file:<sha256>` with the `sha256` the caller
        sends: the checksum job verifies it once the artifact is saved. Only
        `.cif` and `.mmcif` objects are read. The limits are those of the artifact
        endpoint, shared with it.

        Off unless `artifact_extraction.uploads_enabled` is set: the answer is then
        404 with error code `EXTRACTION_OFF`, and the forms keep their own preview
        of the file.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/ExtractUploadedFileRequest"
      responses:
        "200":
          description: Extracted values, as for an artifact; `data.id` is the artifact ID sent.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ArtifactExtractionDocument"
        "400":
          description: Invalid request body.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Extraction of uploads is turned off (error code `EXTRACTION_OFF`), or nothing is
            stored at the URL (`NOT_FOUND`).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The URL is not an uploaded mmCIF object of the artifact, or the sha256 is not 64 lowercase hexadecimal characters.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The user made too many extraction requests in the last minute. `Retry-After` gives seconds.
          headers:
            Retry-After:
              description: Seconds to wait before extracting again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The object could not be read from storage.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Every extraction slot of this server instance is busy. `Retry-After` gives seconds.
          headers:
            Retry-After:
              description: Seconds to wait before extracting again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/files:
    post:
      tags: [Files]
      operationId: createFileUpload
      summary: Create file upload
      description: >
        Creates a multipart upload and returns a presigned PUT URL for every
        part. The client uploads each part, then calls the complete endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateFileUploadRequest"
      responses:
        "200":
          description: File upload created; presigned part URLs returned.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/FileUploadGrantDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File exceeds the configured upload size limit.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/files/complete:
    post:
      tags: [Files]
      operationId: completeFileUpload
      summary: Complete file upload
      description: >
        Assembles the uploaded parts into the final object. The client sends the
        part number and ETag returned by each part upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CompleteFileUploadRequest"
      responses:
        "200":
          description: File upload completed.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CompleteFileUploadDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/abort:
    post:
      tags: [Files]
      operationId: abortFileUpload
      summary: Abort file upload
      description: Cancels an in-progress file upload and discards any parts already uploaded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/AbortFileUploadRequest"
      responses:
        "204":
          description: File upload aborted.
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/{entry_id}.fasta:
    get:
      tags: [Files]
      operationId: getEntryFile
      summary: Download the canonical entry FASTA file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active entry or canonical FASTA artifact not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: More than one canonical FASTA artifact exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Artifact location could not be resolved.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags: [Files]
      operationId: headEntryFile
      summary: Resolve the canonical entry FASTA file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active entry or canonical FASTA artifact not found.
        "409":
          description: More than one canonical FASTA artifact exists.
        "502":
          description: Artifact location could not be resolved.

  /v1/files/{entry_id}/{model_id}/{filename}:
    get:
      tags: [Files]
      operationId: getModelFile
      summary: Download a canonical model file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          description: |
            RCSB-style filename derived from `entry_id`: `<entry_id>.cif`
            or `<entry_id>-sf.cif`.
          schema:
            type: string
          example: pdb_1000axyz.cif
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active model or canonical artifact not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: More than one canonical artifact exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Artifact location could not be resolved.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags: [Files]
      operationId: headModelFile
      summary: Resolve a canonical model file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          description: |
            RCSB-style filename derived from `entry_id`: `<entry_id>.cif`
            or `<entry_id>-sf.cif`.
          schema:
            type: string
          example: pdb_1000axyz.cif
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active model or canonical artifact not found.
        "409":
          description: More than one canonical artifact exists.
        "502":
          description: Artifact location could not be resolved.

  /v1/entries/{entry_id}:
    get:
      tags: [Entries]
      operationId: getEntry
      summary: Get entry
      description: Returns the current active revision of an entry.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entry found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryDocument"
        "404":
          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Entries]
      operationId: deleteEntry
      summary: Delete entry
      description: >
        Soft-deletes an entry. The server adds a revision that marks the entry deleted, without
        its PDB ID, and approves it at once, so the entry leaves every list, search and read
        endpoint and its PDB ID can be used by a new entry. Revisions of the entry and its models
        that are still pending or in review are rejected, and its archive sync jobs are stopped.
        Rows and files are kept. Only callers
        who can approve revisions may delete, and only on servers where entry deletion is turned
        on (dev).
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Entry deleted.
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Entry deletion is turned off on this server, or the caller cannot approve revisions.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found, or already deleted.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry changed while it was being deleted.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries:
    get:
      tags: [Entries]
      operationId: listEntries
      summary: List entries
      description: Lists entries from their current active revisions.
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: >
            Deprecated: use `cursor`. Number of entries to skip. Deep offsets get slower
            and can skip or repeat rows while data changes.
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the entries
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
        - name: query
          in: query
          description: Text to search across entries, models, artifacts, and artifact metadata.
          required: false
          schema:
            type: string
            maxLength: 256
        - name: pdb_id
          in: query
          description: PDB IDs to match against external_refs.pdb of an entry or of one of its active models.
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 64
          style: form
          explode: true
      responses:
        "200":
          description: Entries found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryCollectionDocument"
        "400":
          description: Invalid filters.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Entries]
      operationId: createEntry
      summary: Create entry
      description: >
        Atomically creates a new entry, its initial in-review entry revision,
        and a separate in-review model revision for every add operation.
        When external_refs names a PDB ID, each archive-synced value that equals the
        archive's value for that entry is recorded as from the archive (field source rcsb,
        with accession and release), so the weekly archive sync keeps it current. Every
        other value is recorded as the depositor's, and so is every value when the archive
        lookup fails.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "201":
          description: Entry and initial in-review revision created.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CreateEntryRevisionDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            The request breaks Dynamic PDB Schema rules. Every broken rule is listed, each with
            source.pointer. A key the request does not define gets `UNKNOWN_FIELD`; a key
            starting with `__` gets `RESERVED_KEY`. A value a database check refuses gets code
            `CONSTRAINT_VIOLATION` instead, which names the check and has no source.pointer.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Entry with the same active PDB reference already exists, or the request sends the id
            of an artifact, run or metric that is already stored.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/similar-entries:
    get:
      tags: [Entries]
      operationId: listSimilarEntries
      summary: List similar entries
      description: Lists similar entries from their current active revisions.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Source entry ID.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of similar entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: >
            Deprecated: use `cursor`. Number of similar entries to skip. Deep offsets get slower
            and can skip or repeat rows while data changes.
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the similar entries
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Similar entries found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SimilarEntryCollectionDocument"
        "400":
          description: Invalid cursor.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/models:
    get:
      tags: [Models]
      operationId: listModelsAcrossEntries
      summary: List and search models
      description: >
        Lists models from their current active revisions across active entries, oldest first.
        Each result is one model. Search filters narrow the list: entry filters apply to the
        model's entry (its active revision), model filters to that same model, never to
        another model of the entry. Different filters must all match; several values of one
        filter mean any of them. A missing value (no resolution, unknown Ligands and Cofactors,
        no metric value) never matches a filter that asks for a value or a range;
        metric_missing finds missing metric values.


        Search filters, meta.total, and the entry, review_flags and compounds_needing_review
        fields are available only where the server enables model search; elsewhere a filter
        parameter gets 400 and the response has none of them. The protein chain filters
        (protein_chains_min, protein_chain_length_min, protein_chain_length_max,
        protein_chain_mode) have a switch of their own.
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of models to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: >
            Deprecated: use `cursor`. Number of models to skip. Deep offsets get slower
            and can skip or repeat rows while data changes.
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the models
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
        - name: method
          in: query
          description: >
            Entry filter. Models whose entry's experimental method is one of these values,
            ignoring case. Archive entries keep the archive's text (for example
            "NEUTRON DIFFRACTION"), so this is a list of strings, not StructureMethod.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 100
        - name: resolution_min
          in: query
          description: >
            Entry filter. Models whose entry's resolution, in Å, is at least this value
            (inclusive). An entry with no resolution never matches.
          required: false
          schema:
            type: number
            format: double
        - name: resolution_max
          in: query
          description: >
            Entry filter. Models whose entry's resolution, in Å, is at most this value
            (inclusive). An entry with no resolution never matches.
          required: false
          schema:
            type: number
            format: double
        - name: organism
          in: query
          description: >
            Entry filter. Models whose entry has a polymer entity from one of these source
            organisms: a scientific name (ignoring case, for example "Homo sapiens") or, for a
            value of digits only, an NCBI taxonomy ID (for example 9606).
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 100
        - name: uniprot
          in: query
          description: >
            Entry filter. Models whose entry has a polymer entity mapped to one of these UniProt
            accessions, ignoring case (for example P69905).
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 100
        - name: ligand_or_cofactor
          in: query
          description: >
            Entry filter. Models whose entry lists one of these chemical component IDs (for
            example ADP) in its curated Ligands or its Cofactors, ignoring case. An entry whose
            lists are unknown (absent) never matches. Compounds found in a model's coordinate
            file are the separate compound filter.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 100
        - name: model_type
          in: query
          description: Model filter. Models of one of these types.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/StructureModelType"
        - name: purpose
          in: query
          description: Model filter. Models with one of these purposes.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/ModelPurpose"
        - name: source
          in: query
          description: >
            Model filter. Where the model comes from: pdb_archive is a model taken unchanged
            from a PDB deposition (model type Deposited, or origin archive, which includes
            re-refinements filed under the entry of their experimental data);
            dynamic_pdb_deposit is every other model.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/ModelSearchSource"
        - name: data_level
          in: query
          description: >
            Model filter. Models with at least one file of one of these levels attached to the
            model. Levels belong to files, not to models.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/ArtifactLevel"
        - name: compound
          in: query
          description: >
            Model filter. Models whose coordinate file contains one of these chemical component
            IDs (for example ADP), ignoring case. A file the server has not read yet never
            matches. Compounds the reader marked "needs review" match too; the result lists them
            in compounds_needing_review.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 100
        - name: protein_chains_min
          in: query
          description: >
            Model filter. Models whose coordinate file has at least this many protein chains
            (inclusive). With protein_chain_mode at_least (the default), only chains whose
            deposited length is within protein_chain_length_min and protein_chain_length_max count
            when either is given; all protein chains otherwise. Defaults to 1 when only a length
            bound or the mode is given. Each copy of a chain counts. A chain is an author chain of
            the file's first model; it is a protein chain when the file's _entity_poly.type for
            its entity is polypeptide(L) or polypeptide(D), and, in a file that states no polymer
            type for it (PDB format, most computed models), when more than half of its modeled
            residues are amino acids. A file the server has not read yet never matches. Example:
            "more than four protein chains, each longer than 300 residues" is
            protein_chains_min=5&protein_chain_length_min=301. Available only where the server
            enables the protein chain filters; elsewhere 400.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: protein_chain_length_min
          in: query
          description: >
            Model filter, with protein_chains_min and protein_chain_mode. Lowest deposited sequence
            length of a protein chain, in residues (inclusive); residues without coordinates count.
            The length is the file's own (_entity_poly_seq, SEQRES), else the entry's FASTA record
            for the chain. A chain whose length is unknown never satisfies a length bound.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: protein_chain_length_max
          in: query
          description: >
            Model filter, with protein_chains_min and protein_chain_mode. Highest deposited
            sequence length of a protein chain, in residues (inclusive). A chain whose length is
            unknown never satisfies a length bound.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: protein_chain_mode
          in: query
          description: >
            Model filter, with the protein chain length bounds. at_least (the default): at least
            protein_chains_min protein chains have a deposited length within the bounds; other
            protein chains may be shorter or longer. every: the file has at least
            protein_chains_min protein chains, and every one of them has a deposited length within
            the bounds, so a single chain outside them, or of unknown length, rules the model out.
            every needs protein_chain_length_min or protein_chain_length_max. Example: "at least
            two protein chains, all longer than 300 residues" is
            protein_chain_mode=every&protein_chains_min=2&protein_chain_length_min=301.
          required: false
          schema:
            $ref: '#/components/schemas/ProteinChainMode'
        - name: r_work_min
          in: query
          description: >
            Models whose r_work is at least this value (inclusive). A model with no value for
            r_work never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: r_work_max
          in: query
          description: >
            Models whose r_work is at most this value (inclusive). A model with no value for
            r_work never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: r_free_min
          in: query
          description: >
            Models whose r_free is at least this value (inclusive). A model with no value for
            r_free never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: r_free_max
          in: query
          description: >
            Models whose r_free is at most this value (inclusive). A model with no value for
            r_free never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: cc_min
          in: query
          description: >
            Models whose cc is at least this value (inclusive). A model with no value for
            cc never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: cc_max
          in: query
          description: >
            Models whose cc is at most this value (inclusive). A model with no value for
            cc never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: rscc_min
          in: query
          description: >
            Models whose rscc is at least this value (inclusive). A model with no value for
            rscc never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: rscc_max
          in: query
          description: >
            Models whose rscc is at most this value (inclusive). A model with no value for
            rscc never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: clashscore_min
          in: query
          description: >
            Models whose clashscore is at least this value (inclusive). A model with no value for
            clashscore never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: clashscore_max
          in: query
          description: >
            Models whose clashscore is at most this value (inclusive). A model with no value for
            clashscore never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: ramachandran_outliers_min
          in: query
          description: >
            Models whose ramachandran_outliers is at least this value (inclusive). A model with no value for
            ramachandran_outliers never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: ramachandran_outliers_max
          in: query
          description: >
            Models whose ramachandran_outliers is at most this value (inclusive). A model with no value for
            ramachandran_outliers never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: side_chain_outliers_min
          in: query
          description: >
            Models whose side_chain_outliers is at least this value (inclusive). A model with no value for
            side_chain_outliers never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: side_chain_outliers_max
          in: query
          description: >
            Models whose side_chain_outliers is at most this value (inclusive). A model with no value for
            side_chain_outliers never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: molprobity_score_min
          in: query
          description: >
            Models whose molprobity_score is at least this value (inclusive). A model with no value for
            molprobity_score never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: molprobity_score_max
          in: query
          description: >
            Models whose molprobity_score is at most this value (inclusive). A model with no value for
            molprobity_score never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: wilson_b_min
          in: query
          description: >
            Models whose wilson_b is at least this value (inclusive). A model with no value for
            wilson_b never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: wilson_b_max
          in: query
          description: >
            Models whose wilson_b is at most this value (inclusive). A model with no value for
            wilson_b never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: rmsf_min
          in: query
          description: >
            Models whose rmsf is at least this value (inclusive). A model with no value for
            rmsf never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: rmsf_max
          in: query
          description: >
            Models whose rmsf is at most this value (inclusive). A model with no value for
            rmsf never matches; metric_missing finds those.
          required: false
          schema:
            type: number
            format: double
        - name: metric_missing
          in: query
          description: >
            Model filter. Models that have no value for at least one of these metrics.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/MetricKey"
        - name: flagged
          in: query
          description: >
            true returns only models with an open review flag (on the model, its current
            revision, its entry or the entry's polymer entities); false returns only models
            without one. Results always list their flags in review_flags.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Models found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelSearchCollectionDocument"
        "400":
          description: >
            Invalid filters, or a filter parameter where the server does not enable model
            search. The detail names the parameter.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            Too many requests from this client (code RATE_LIMITED). Searches that count their
            results (requests without cursor) have their own limit. Wait the number of seconds in
            Retry-After; to read many results, follow links.next instead of repeating the search.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: >
            The search did not finish within the server's time limit (code TIMEOUT). Add filters
            that narrow the result, for example a model type or a resolution range, and try again
            after Retry-After seconds.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/selections:
    post:
      tags: [Selections]
      operationId: createSelection
      summary: Save a frozen selection
      description: >
        Saves a selection of models with the model revision and entry revision each one has now.
        Later changes to the catalog never change a saved selection: downloads of it name the same
        revisions. The selection holds every model in model_ids, and every model matching one of
        the searches, minus exclude_model_ids; a model is held once. A search is the query string
        of a GET /v1/models request, so it holds every result of that search, however many pages
        it has and whatever its meta.total shows.


        Selections need no sign-in. Anyone with the ID can read one, so share the link to share
        the selection. Selections are kept indefinitely.


        Saving a large search takes seconds. Available only where the server enables selections;
        elsewhere every selections route answers 404 with code SELECTIONS_OFF.
      security: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateSelectionRequest"
      responses:
        "201":
          description: Selection saved.
          headers:
            Location:
              description: URL of the saved selection.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SelectionDocument"
        "400":
          description: >
            The body is not valid JSON, or a search has filters where the server does not enable
            model search.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Selections are turned off on this server (code SELECTIONS_OFF).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            The request is invalid; each error points at its field (for example a model ID with no
            active model, or an unknown search parameter). Code SELECTION_EMPTY: nothing matched.
            Code SELECTION_TOO_LARGE: more models matched than one selection may hold; narrow the
            searches.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            Too many selections saved by this client (code RATE_LIMITED). Wait the number of
            seconds in Retry-After.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            The server is saving other selections (code SERVICE_UNAVAILABLE), or the space for
            selections is used up (code SELECTIONS_FULL). Try again after Retry-After seconds.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: >
            Saving did not finish within the server's time limit (code TIMEOUT). Narrow the
            searches, for example with a model type or a resolution range, and try again after
            Retry-After seconds.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/selections/{selection_id}:
    get:
      tags: [Selections]
      operationId: getSelection
      summary: Get a frozen selection
      description: >
        Returns a saved selection: how many models and entries it holds and what was asked for.
        Its models, with their frozen revisions, are at links.models.
      security: []
      parameters:
        - name: selection_id
          in: path
          description: Selection ID, as POST /v1/selections returned it.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Selection found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SelectionDocument"
        "404":
          description: No selection has this ID, or selections are turned off (code SELECTIONS_OFF).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/selections/{selection_id}/models:
    get:
      tags: [Selections]
      operationId: listSelectionModels
      summary: List the models of a frozen selection
      description: >
        Lists the models of a saved selection with the model revision and entry revision frozen
        for each, in the order GET /v1/models lists models.
      security: []
      parameters:
        - name: selection_id
          in: path
          description: Selection ID, as POST /v1/selections returned it.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of models to return.
          required: false
          schema:
