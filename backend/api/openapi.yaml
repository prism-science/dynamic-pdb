    CreateFileUploadRequest:
      type: object
      required: [entry_id, artifact_id, filename, size]
      properties:
        entry_id:
          type: string
          description: Entry identifier that owns this file.
        model_id:
          type: string
          nullable: true
          description: Model identifier for model-level files; null for entry-level files.
        artifact_id:
          type: string
          format: uuid
          description: Artifact identifier this file belongs to.
        filename:
          type: string
          minLength: 1
          description: Original filename to keep as the final object key suffix.
        size:
          type: integer
          format: int64
          description: Total size in bytes of the file to upload.

    FileUploadGrantAttributes:
      type: object
      required: [key, upload_id, object_url, part_size, parts]
      properties:
        key:
          type: string
          description: Object key the assembled file will be stored under.
        upload_id:
          type: string
          description: Identifier of the initiated multipart upload; echoed back on complete and abort.
        object_url:
          type: string
          description: Public HTTP object URL to store with the artifact.
        part_size:
          type: integer
          format: int64
          description: Size in bytes of every part except the last; the client must slice the file at this boundary.
        parts:
          type: array
          description: Presigned PUT targets, one per part, in ascending part-number order.
          items:
            $ref: "#/components/schemas/FileUploadPart"

    FileUploadPart:
      type: object
      required: [part_number, url]
      properties:
        part_number:
          type: integer
          description: 1-based index of this part.
        url:
          type: string
          description: Presigned URL the client PUTs this part's bytes to.

    CompleteFileUploadRequest:
      type: object
      required: [key, upload_id, parts]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.
        parts:
          type: array
          description: The uploaded parts, each with the ETag object storage returned for it.
          items:
            $ref: "#/components/schemas/CompletedFileUploadPart"

    CompletedFileUploadPart:
      type: object
      required: [part_number, etag]
      properties:
        part_number:
          type: integer
          description: 1-based index of the part.
        etag:
          type: string
          description: ETag returned in the response header when the part was uploaded.

    CompleteFileUploadAttributes:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Object key the completed file is stored under.

    AbortFileUploadRequest:
      type: object
      required: [key, upload_id]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.

    GitHubExchangeRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    GitHubCodeExchangeRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
        redirect_uri:
          type: string

    TokenAttributes:
      type: object
      required: [token_type, access_token, expires_at, name, email, login, permissions]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
        login:
          type: string
        permissions:
          type: array
          description: >
            Permission keys the user holds. Users with `revisions.approve` also
            get `entries.delete` where the server allows entry deletion, and
            `revisions.approve_own` where it allows self-approval (dev only).
          items:
            type: string

    EntryProperties:
      type: object
      properties:
        external_refs:
          type: object
          additionalProperties:
            type: string
        details:
          type: string
          description: Additional structure remarks; RCSB sync maps struct.pdbx_details here.
        resolution:
          type: number
          format: double
        method:
          type: string
          description: >
            Experimental method. A create or entry revision request that sends a method
            must use one of StructureMethod, or get 422 INVALID_VALUE. A create may also
            keep the archive's method for the PDB ID it names. Entries the archive sync
            imports keep the archive's text, so responses can carry other values.
        space_group:
          type: string
        crystallography:
          $ref: "#/components/schemas/EntryCrystallography"
        ligands:
          type: array
          description: >
            Ligand component IDs of the sample. Absent means unknown; an empty list means none.
          items:
            type: string
        cofactors:
          type: array
          description: >
            Cofactor component IDs of the sample. Absent means unknown; an empty list means none.
          items:
            type: string
        related_datasets:
          type: array
          maxItems: 20
          description: >
            Datasets kept elsewhere that relate to this entry, by DOI or by the repository's
            accession, as mmCIF _pdbx_related_exp_data_set records them. Set only by people; the
            archive sync never changes them. We store no copy and no checksum of these datasets.
            Absent when none are given; a change that sends null or an empty list removes them.
            A malformed dataset is refused with 422 in every validation mode.
          items:
            $ref: "#/components/schemas/RelatedDataset"

    RelatedDataset:
      type: object
      description: >
        A dataset named by a DOI, by the repository's accession, or by both: one of doi and
        accession is required.
      required: [data_type]
      example:
        doi: 10.15785/SBGRID/1303
        data_type: diffraction image data
        repository: SBGrid Data Bank
        details: Similar crystals, collected in October 2025.
      properties:
        doi:
          type: string
          description: >
            mmCIF data_reference. A DOI such as 10.15785/SBGRID/1303. A resolver URL
            (https://doi.org/…) or a "doi:" prefix is accepted and stored as the bare DOI.
            DOIs are case-insensitive, so an entry cannot list the same one twice. Absent on a
            dataset named only by its accession.
        accession:
          type: string
          maxLength: 256
          description: >
            The repository's own ID for a dataset that has no DOI, or has one besides, such as
            EMPIAR-10028. Accessions are compared case-insensitively, so an entry cannot list the
            same one twice in the same repository. A dataset with no repository counts as one
            repository of its own: the same accession twice with no repository is refused, but
            once with a repository and once without is allowed.
        landing_url:
          type: string
          maxLength: 2048
          description: >
            The dataset's page in its repository, such as
            https://www.ebi.ac.uk/empiar/EMPIAR-10028/. An absolute http or https URL with a
            host, without spaces or a user name and password.
        data_type:
          type: string
          maxLength: 256
          description: >
            mmCIF data_set_type: what the dataset holds, for example "diffraction image data" or
            "NMR free induction decay data".
        repository:
          type: string
          maxLength: 256
          description: mmCIF db_source, for example "SBGrid Data Bank" or "Zenodo".
        details:
          type: string
          maxLength: 2000
          description: >
            mmCIF details: what the dataset contains and how it relates to this entry.

    EntryCrystallography:
      type: object
      description: Crystals and diffraction datasets reported for this entry.
      properties:
        crystals:
          type: array
          items:
            $ref: "#/components/schemas/EntryCrystal"

    EntryCrystal:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: RCSB exptl_crystal.id.
        growth:
          $ref: "#/components/schemas/EntryCrystalGrowth"
        diffractions:
          type: array
          items:
            $ref: "#/components/schemas/EntryDiffraction"

    EntryCrystalGrowth:
      type: object
      properties:
        ph:
          type: number
          format: double
          description: Crystal-growth pH from RCSB exptl_crystal_grow.pH.
        temperature_kelvin:
          type: number
          format: double
          description: Crystal-growth temperature in kelvins from RCSB exptl_crystal_grow.temp.

    EntryDiffraction:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: RCSB diffrn.id.
        temperature_kelvin:
          type: number
          format: double
          description: Data-collection temperature in kelvins from RCSB diffrn.ambient_temp.

    EntryInfoAttributes:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          required: [id, created_by, title, created_at, updated_at]
          properties:
            id:
              type: string
            created_by:
              type: string
              format: uuid
            title:
              type: string
              nullable: true
            thumbnail_image_url:
              type: string
              nullable: true
            revision_number:
              type: integer
              nullable: true
              description: >
                Number of the entry revision these values come from; it grows by one with each
                published change. Null only for a revision that was never published.
            published_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    SimilarEntryAttributes:
      type: object
      required: [entry, score, matches]
      properties:
        entry:
          $ref: "#/components/schemas/EntryInfoAttributes"
        score:
          type: number
          format: double
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ProteinSequenceSimilarityMatch"

    ProteinSequenceSimilarityMatch:
      type: object
      required: [source_sequence_id, similar_sequence, score, tool, metadata, created_at]
      properties:
        source_sequence_id:
          type: string
          format: uuid
        similar_sequence:
          $ref: "#/components/schemas/ProteinSequence"
        score:
          type: number
          format: double
        tool:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    CreateEntryRequest:
      type: object
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/CreateEntryData"
        model_operations:
          type: array
          description: Models to create as independent in-review revisions.
          items:
            $ref: "#/components/schemas/AddModelOperation"

    CreateEntryData:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          required: [title, method]
          properties:
            title:
              type: string
              minLength: 1
            thumbnail_image_url:
              type: string
              nullable: true
            artifacts:
              type: array
              items:
                $ref: "#/components/schemas/CreateArtifactRequest"
            polymer_entities:
              $ref: "#/components/schemas/DepositorPolymerEntities"
            value_sources:
              description: >
                As on a model, except that the artifact must be one of this request's entry
                artifacts: an entry has no primary artifact. A value equal to the archive's
                is recorded as the archive's all the same, so the archive sync keeps it
                current.
              allOf:
                - $ref: "#/components/schemas/ValueSources"

    Entry:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          required: [id, created_by, title, created_at, updated_at, protein_sequences]
          properties:
            id:
              type: string
            created_by:
              type: string
              format: uuid
            title:
              type: string
              nullable: true
            thumbnail_image_url:
              type: string
              nullable: true
            published_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            protein_sequences:
              type: array
              items:
                $ref: "#/components/schemas/ProteinSequence"

    ArchivePdbDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ArchivePdbData"

    ArchivePdbData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [archive_pdb_lookups]
        id:
          type: string
          description: Upper-case PDB ID.
        attributes:
          $ref: "#/components/schemas/ArchivePdbAttributes"

    ArchivePdbAttributes:
      type: object
      required: [entry, model, polymer_entities, warnings]
      properties:
        entry:
          $ref: "#/components/schemas/ArchiveEntryProposal"
        model:
          $ref: "#/components/schemas/ArchiveModelProposal"
        polymer_entities:
          type: array
          items:
            $ref: "#/components/schemas/ArchivePolymerEntityProposal"
        warnings:
          type: array
          description: Problems with the lookup as a whole, such as an unknown UniProt release.
          items:
            $ref: "#/components/schemas/ArchiveWarning"

    ArchiveReport:
      type: object
      required: [provenance, conflicts, warnings]
      properties:
        provenance:
          type: object
          description: Maps each proposed field to the RCSB path it is read from.
          additionalProperties:
            type: string
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveConflict"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveWarning"

    ArchiveConflict:
      type: object
      required: [field, chosen, others]
      properties:
        field:
          type: string
        chosen:
          type: string
          description: The value that is proposed.
        others:
          type: array
          description: Other values RCSB reports for the field.
          items:
            type: string

    ArchiveWarning:
      type: object
      required: [source, detail]
      properties:
        source:
          type: string
          enum: [archive, validation]
          description: >
            `archive` for a problem found while reading RCSB, `validation` for a
            proposed value that breaks the schema rules.
        field:
          type: string
          description: Proposed field the warning is about, for `archive` warnings.
        pointer:
          type: string
          description: JSON pointer into the proposal, for `validation` warnings.
        code:
          type: string
          description: Validation code, for `validation` warnings.
        detail:
          type: string

    ExtractUploadedFileRequest:
      type: object
      required: [artifact_id, object_url, sha256]
      properties:
        artifact_id:
          type: string
          format: uuid
          description: The artifact ID the file was uploaded under (`POST /v1/files`).
        object_url:
          type: string
          minLength: 1
          description: The `object_url` the upload returned.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The SHA-256 of the uploaded file, in lowercase hexadecimal.

    ArtifactExtractionDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ArtifactExtractionData"

    ArtifactExtractionData:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [artifact_extractions]
        id:
          type: string
          format: uuid
          description: The artifact ID.
        attributes:
          $ref: "#/components/schemas/ArtifactExtractionAttributes"

    ArtifactExtractionAttributes:
      type: object
      required: [source, reference_version, bytes_read, object_size, truncated, values, warnings]
      properties:
        source:
          type: string
          description: "`file:<sha256>` of the artifact; every value carries the same source."
        reference_version:
          type: string
          description: Versions of the reference lists that sorted compounds into cofactors and ligands, one per list (cofactors, metal ions, solvents, covalent cofactors, CCD types), for example `cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0`.
        bytes_read:
          type: integer
          format: int64
        object_size:
          type: integer
          format: int64
        truncated:
          type: boolean
          description: True when the file is larger than the bytes read.
        values:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedValue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionWarning"

    ExtractedValue:
      type: object
      required: [name, value, source, needs_review]
      properties:
        name:
          type: string
          description: >
            One of `atom_count`, `modeled_residues`, `unique_protein_chains`,
            `altloc_fraction`, `member_count`, `ligands`, `cofactors`, `compound_sources`,
            `glycan_descriptors`, `mutations`, `program_name`, `program_version`,
            and the header items `entry_id`, `authors`, `r_work`, `r_free`,
            `resolution`, `method`, `space_group`. A header item is a non-looped
            mmCIF item (`_entry.id` or the data block name, `_audit_author`,
            `_refine.ls_R_factor_R_work`, `_refine.ls_R_factor_R_free`,
            `_refine.ls_d_res_high` or `_reflns.d_resolution_high`,
            `_exptl.method`, `_symmetry.space_group_name_H-M` or
            `_space_group.name_H-M_alt`) and is left out when the file gives
            none or writes its category as a loop; `entry_id` only when it is a
            PDB ID, `method` as the file writes it.
        value:
          description: >
            A number for the counts, fraction, R-factors and resolution, a
            string for the program, `entry_id`, `method` and `space_group`, a
            list of names for `authors`, a list of compounds or mutation sets for
            `ligands`, `cofactors` and `mutations`. `compound_sources` is the decision record: the groups
            `ligands`, `cofactors` and `excluded`, each mapping a CCD ID to the
            `rule` that placed it (`list`, `metalc`, `branched`, `macrolide`,
            `ccd_type`, `depositor_flag`, `covalent_map` or `ihm_probe`) and the
            reference `list_version`; water and polymer residues are never in it.
            `glycan_descriptors` lists one glycan per branched entity:
            `entity_id`, `compound_ids` and its WURCS `descriptors` (`descriptor`,
            `type`, `program`, `program_version`).
          example:
            ligands:
              NAG: {rule: branched, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}
            cofactors:
              ZN: {rule: metalc, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}
            excluded:
              GOL: {rule: list, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}
        source:
          type: string
          description: "`file:<sha256>`."
        needs_review:
          type: boolean
        review_reason:
          type: string

    ExtractionWarning:
      type: object
      required: [detail]
      properties:
        field:
          type: string
        pointer:
          type: string
          description: JSON pointer into the extracted values, for schema-rule violations.
        code:
          type: string
        detail:
          type: string

    ArchiveRevisionGroup:
      type: object
      required: [group, revision_ordinal]
      properties:
        group:
          type: string
        revision_ordinal:
          type: integer

    ArchiveEntryProposal:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - $ref: "#/components/schemas/ArchiveReport"
        - type: object
          required: [revision_groups, supersedes, superseded_by]
          properties:
            title:
              type: string
              nullable: true
            status_code:
              type: string
              description: RCSB status, for example `REL`.
            initial_release_date:
              type: string
              format: date-time
            latest_revision_date:
              type: string
              format: date-time
            latest_version:
              type: string
              description: Latest RCSB major and minor version, for example `4.3`.
            revision_groups:
              type: array
              items:
                $ref: "#/components/schemas/ArchiveRevisionGroup"
            supersedes:
              type: array
              description: PDB IDs this entry replaced.
              items:
                type: string
            superseded_by:
              type: array
              description: PDB IDs that replaced this entry when it was made obsolete.
              items:
                type: string

    ArchiveMetric:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: number
