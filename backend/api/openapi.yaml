        in: path
        required: true
        schema:
          type: string
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Revisions]
      operationId: getEntryRevision
      summary: Get entry revision
      description: Reviewer-only access to a specific entry revision.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entry revision found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryRevisionDocument"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller does not have the reviewer role.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry revision not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Revisions]
      operationId: updateEntryRevisionState
      summary: Update entry revision
      description: >
        Changes a revision from `in_review` to active or rejected. Activating
        requires `revisions.approve`; rejecting requires `revisions.reject`.
        A reviewer cannot approve a revision they created (403 `SELF_REVIEW`);
        they can reject it. Servers that allow self-approval (dev only) skip
        this check.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/UpdateRevisionStateRequest"
