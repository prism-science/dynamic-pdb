    CreateArtifactRequest:
      type: object
      required: [id, name, level]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        level:
          $ref: "#/components/schemas/ArtifactLevel"
        type:
          allOf:
