          description: Invalid state transition.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Caller does not have the required permission, or asks to approve
            a revision they created (code `SELF_REVIEW`).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry revision not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry revision changed since it was loaded.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            A database check refused the change (code `CONSTRAINT_VIOLATION`). The error
            names the check and has no source.pointer.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

