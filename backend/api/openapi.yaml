openapi: 3.0.3
info:
  title: dynamic-pdb backend API
  version: 0.0.0

paths:
  /livez:
    get:
      operationId: livez
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /v1/auth/github/exchange:
    post:
      operationId: exchangeGithubToken
      summary: Exchange a GitHub access token for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub access token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/github/code/exchange:
    post:
      operationId: exchangeGithubCode
      summary: Exchange a GitHub authorization code for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubCodeExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub authorization code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files:
    post:
      operationId: createFileUpload
      summary: Create a file upload and presign its parts
      description: >
        Creates a multipart upload and returns a presigned PUT URL for every
        part. The client uploads each part, then calls the complete endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileUploadRequest"
      responses:
        "200":
          description: File upload created; presigned part URLs returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadGrantResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/files/complete:
    post:
      operationId: completeFileUpload
      summary: Complete a file upload
      description: >
        Assembles the uploaded parts into the final object. The client sends the
        part number and ETag returned by each part upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteFileUploadRequest"
      responses:
        "200":
          description: File upload completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteFileUploadResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/abort:
    post:
      operationId: abortFileUpload
      summary: Abort a file upload
      description: Cancels an in-progress file upload and discards any parts already uploaded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortFileUploadRequest"
      responses:
        "204":
          description: File upload aborted.
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries:
    get:
      operationId: listEntries
      summary: List entries
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of entries to skip.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: query
          in: query
          description: Text to search across entries, models, artifacts, and artifact metadata.
          required: false
          schema:
            type: string
        - name: pdb_id
          in: query
          description: PDB IDs to match against entry metadata.external_refs.pdb.
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          description: >
            Which lifecycle bucket to list. "active" (default) is published
            entries. "under_review" and "archived" (rejected/withdrawn) are
            always scoped to the authenticated caller's own entries.
          required: false
          schema:
            type: string
            enum: [active, under_review, archived]
        - name: mine
          in: query
          description: >
            When true, restrict the result to the authenticated caller's own
            entries (applies to the active catalog too). Ignored when there is
            no authenticated caller.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Entries found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createEntry
      summary: Create entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "201":
          description: Draft entry created.
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry with the same active PDB reference already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}:
    patch:
      operationId: updateEntry
      summary: Edit or submit a draft entry
      description: >
        Author-only. Allowed while the entry is in state `pending` or `rejected`.
        Set `state` to `in_review` to submit the draft for review; this also
        submits the models and artifacts created in the same draft, which are
        published together with the entry on approval.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntryRequest"
      responses:
        "200":
          description: Entry updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the entry creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry is not in an editable state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getEntry
      summary: Get entry
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entry found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEntry
      summary: Delete entry
      description: Deletes an entry and all nested models, revisions, and search rows. Only the entry creator can delete it.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Entry deleted.
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the entry creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/similar-entries:
    get:
      operationId: listSimilarEntries
      summary: List entries with similar protein sequences
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Source entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of similar entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of similar entries to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Similar entries found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarEntryListResponse"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models:
    get:
      operationId: listModels
      summary: List models
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of models to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of models to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Models found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createModel
      summary: Create model
      description: Adds a model, its artifacts, runs, relations, and metrics to an existing entry. Runs may reference artifacts created in this request or entry-level artifacts that already exist.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry the model belongs to.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
      responses:
        "201":
          description: Draft model created.
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}:
    patch:
      operationId: updateModel
      summary: Edit or submit a draft model
      description: >
        Author-only. Allowed while the model is in state `pending` or `rejected`.
        Set `state` to `in_review` to submit the model for review.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelRequest"
      responses:
        "200":
          description: Model updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the model creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Model is not in an editable state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getModel
      summary: Get model
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Model found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteModel
      summary: Delete model
      description: Deletes one model and its revisions. Only the model creator can delete it.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Model deleted.
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the model creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/artifacts:
    get:
      operationId: listArtifacts
      summary: List artifacts
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: levels
          in: query
          description: Artifact levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArtifactLevel"
        - name: limit
          in: query
          description: Maximum number of artifacts to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of artifacts to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Artifacts found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}/artifacts:
    get:
      operationId: listModelArtifacts
      summary: List model artifacts
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: levels
          in: query
          description: Artifact levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArtifactLevel"
        - name: limit
          in: query
          description: Maximum number of artifacts to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of artifacts to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Model artifacts found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelArtifactListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/reviews:
    get:
      operationId: listReviews
      summary: List entries awaiting review
      description: >
        One row per entry: entries whose own revision is in_review, plus entries
        that have at least one model revision in_review. A model never produces a
        row of its own. The configured reviewer sees the whole queue; any other
        caller sees only what they submitted.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Review queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/reviews/{entry_id}:
    get:
      operationId: getEntryReview
      summary: Get the submission waiting on an entry
      description: >
        The entry and each of its models under review, each as an
        `active` / `proposed` pair of identically shaped objects. `active` is the
        published revision, `proposed` is the one waiting for a decision.
        `active` is null when the thing is new; the entry's `proposed` is null
        when the entry itself was not touched and only its models were submitted.
        Models with nothing in review are omitted.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryReview"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither the reviewer nor the submitter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No submission waiting on this entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/reviews/{entry_id}/decision:
    post:
      operationId: decideEntryReview
      summary: Approve or reject a submission
      description: >
        Reviewer-only, all or nothing: the entry revision (when it is in review)
        and every model revision in review under it are decided together in one
        transaction. `comment` is required when rejecting.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Decision applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryReview"
        "400":
          description: Invalid request (e.g. reject without a comment).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the reviewer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No submission waiting on this entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The submission changed since it was loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CreateFileUploadRequest:
      type: object
      required: [entry_id, artifact_id, filename, size]
      properties:
        entry_id:
          type: string
          format: uuid
          description: Entry identifier that owns this file.
        model_id:
          type: string
          format: uuid
          nullable: true
          description: Model identifier for model-level files; null for entry-level files.
        artifact_id:
          type: string
          format: uuid
          description: Artifact identifier this file belongs to.
        filename:
          type: string
          minLength: 1
          description: Original filename to keep as the final object key suffix.
        size:
          type: integer
          format: int64
          description: Total size in bytes of the file to upload.

    FileUploadGrantResponse:
      type: object
      required: [key, upload_id, object_url, part_size, parts]
      properties:
        key:
          type: string
          description: Object key the assembled file will be stored under.
        upload_id:
          type: string
          description: Identifier of the initiated multipart upload; echoed back on complete and abort.
        object_url:
          type: string
          description: Public HTTP object URL to store with the artifact.
        part_size:
          type: integer
          format: int64
          description: Size in bytes of every part except the last; the client must slice the file at this boundary.
        parts:
          type: array
          description: Presigned PUT targets, one per part, in ascending part-number order.
          items:
            $ref: "#/components/schemas/FileUploadPart"

    FileUploadPart:
      type: object
      required: [part_number, url]
      properties:
        part_number:
          type: integer
          description: 1-based index of this part.
        url:
          type: string
          description: Presigned URL the client PUTs this part's bytes to.

    CompleteFileUploadRequest:
      type: object
      required: [key, upload_id, parts]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.
        parts:
          type: array
          description: The uploaded parts, each with the ETag object storage returned for it.
          items:
            $ref: "#/components/schemas/CompletedFileUploadPart"

