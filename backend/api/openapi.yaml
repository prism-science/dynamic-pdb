          required: [provider]
          additionalProperties: false
          properties:
            provider:
              type: string
            experiment_id:
              type: string
            path:
              type: string
            sha256:
              type: string
        archive_version:
          type: string
          description: >
            RCSB version (major.minor) an archive coordinate file stands for. The archive sync
            sets it on the file a new Deposited model revision links when RCSB changes the
            coordinates.
        extensions:
          $ref: "#/components/schemas/Extensions"

    RunMetadata:
      type: object
      description: >
        Run metadata. The only key is extensions; other keys get 422. Keys starting with "__" are reserved.
      additionalProperties: false
      x-go-type: map[string]interface{}
      properties:
        extensions:
          $ref: "#/components/schemas/Extensions"

    Extensions:
      type: object
      description: Open data. Any key is accepted except keys starting with "__".
