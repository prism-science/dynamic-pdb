          type: array
          items:
            $ref: "#/components/schemas/ResidueData"
        idempotency_key:
          type: string
          nullable: true
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"

    ModelPurpose:
      type: string
      enum: [Model Building, Refinement, Reference]
      x-enum-varnames: [ModelPurposeModelBuilding, ModelPurposeRefinement, ModelPurposeReference]

    StructureModelType:
      type: string
      enum: [Single Conformer, Multiconformer, Ensemble, Deposited]
      x-enum-varnames:
        [
          StructureModelTypeSingleConformer,
          StructureModelTypeMulticonformer,
          StructureModelTypeEnsemble,
          StructureModelTypeDeposited,
        ]

    MetricKey:
      type: string
      enum:
        - r_work
        - r_free
        - cc
        - rscc
        - clashscore
        - ramachandran_outliers
        - side_chain_outliers
        - molprobity_score
        - wilson_b
        - rmsf
      x-enum-varnames:
        [
          MetricKeyRWork,
          MetricKeyRFree,
          MetricKeyCC,
          MetricKeyRSCC,
          MetricKeyClashscore,
          MetricKeyRamachandranOutliers,
          MetricKeySideChainOutliers,
          MetricKeyMolProbityScore,
          MetricKeyWilsonB,
          MetricKeyRMSF,
        ]

    ModelMetadata:
      type: object
      description: >
        Model metadata. Keys outside this list get 422 when validation mode is enforce;
        open data goes in extensions. Keys starting with "__" are reserved. The list
        fields distinguish unknown (null or omitted) from known empty ([]).
      additionalProperties: false
      x-go-type: map[string]interface{}
      properties:
        external_refs:
          type: object
          additionalProperties:
            type: string
        details:
          type: string
        authors:
          type: array
          nullable: true
          items:
            type: string
        affiliation:
          type: string
        purpose:
          $ref: "#/components/schemas/ModelPurpose"
        model_type:
          $ref: "#/components/schemas/StructureModelType"
        atom_count:
          type: integer
          minimum: 0
        modeled_residues:
          type: integer
          minimum: 0
        unique_protein_chains:
          type: integer
          minimum: 0
        altloc_fraction:
          type: number
          format: double
          minimum: 0
          maximum: 1
        unmodeled_fraction:
          type: number
          format: double
          minimum: 0
          maximum: 1
        ligands:
          type: array
          nullable: true
          items:
            type: string
        cofactors:
          type: array
          nullable: true
          items:
            type: string
        residue_data:
          type: array
          items:
            $ref: "#/components/schemas/ResidueData"
        extensions:
          $ref: "#/components/schemas/Extensions"

    ArtifactMetadata:
      type: object
      description: >
        Artifact metadata. Keys outside this list get 422 when validation mode is enforce;
        open data goes in extensions. Keys starting with "__" are reserved.
      additionalProperties: false
      x-go-type: map[string]interface{}
      properties:
        records:
          type: array
          description: FASTA records.
          items:
            type: object
            required: [header, sequence]
            additionalProperties: false
            properties:
              header:
                type: string
              sequence:
                type: string
        _dynamic_pdb_source:
          type: object
          description: External experiment the file came from.
          required: [provider]
          additionalProperties: false
          properties:
            provider:
              type: string
            experiment_id:
              type: string
            path:
              type: string
            sha256:
              type: string
        archive_version:
          type: string
          description: >
            RCSB version (major.minor) an archive coordinate file stands for. The archive sync
            sets it on the file a new Deposited model revision links when RCSB changes the
            coordinates.
        extensions:
          $ref: "#/components/schemas/Extensions"

    RunMetadata:
      type: object
      description: >
        Run metadata. The only key is extensions; other keys get 422 when validation
        mode is enforce. Keys starting with "__" are reserved.
      additionalProperties: false
      x-go-type: map[string]interface{}
      properties:
        extensions:
          $ref: "#/components/schemas/Extensions"

    Extensions:
      type: object
      description: Open data. Any key is accepted except keys starting with "__".
      additionalProperties: true

    DepositorPolymerEntities:
      type: array
      description: >
        Polymer-entity values the depositor supplies, matched to extracted entities by
        label_entity_id. Construct and mutations take precedence over extracted values;
        source_organisms is used only when extraction finds none.
      items:
        $ref: "#/components/schemas/DepositorPolymerEntity"

    DepositorPolymerEntity:
      type: object
      required: [label_entity_id]
      additionalProperties: false
      properties:
        label_entity_id:
          type: string
          minLength: 1
        construct:
          type: string
        mutations:
          type: array
          items:
            type: string
            pattern: "^[A-Z][1-9][0-9]*[A-Z]$"
        source_organisms:
          type: array
          items:
            $ref: "#/components/schemas/PolymerEntityOrganism"

    ArtifactLevel:
      type: string
      enum: [L0, L1, L2, L3]

    ArtifactType:
      type: string
      enum: [model, structure_factors, fasta, other]
      x-enum-varnames:
        [ArtifactTypeModel, ArtifactTypeStructureFactors, ArtifactTypeFASTA, ArtifactTypeOther]

    RunArtifactDirection:
      type: string
      enum: [input, output]

    CreateArtifactRequest:
      type: object
      required: [id, name, level]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        level:
          $ref: "#/components/schemas/ArtifactLevel"
        type:
          allOf:
            - $ref: "#/components/schemas/ArtifactType"
          description: Required by Dynamic PDB Schema v0.2.0. A request without it gets 422 when validation mode is enforce; in log_only mode the artifact is stored as other.
        uri:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
          description: File encoding, lowercase, from an open vocabulary (for example mmcif, mtz, fasta). Uppercase letters get 422 when validation mode is enforce.
        size_bytes:
          type: integer
          format: int64
          nullable: true
        metadata:
          $ref: "#/components/schemas/ArtifactMetadata"

    ArtifactAttributes:
      type: object
      required: [id, name, level, type, metadata, created_by, created_at, checksum]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          $ref: "#/components/schemas/ArtifactLevel"
        type:
          $ref: "#/components/schemas/ArtifactType"
        uri:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        metadata:
          $ref: "#/components/schemas/ArtifactMetadata"
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        checksum:
          $ref: "#/components/schemas/ArtifactChecksum"

    ArtifactChecksum:
      type: object
      description: >-
        What the checksum job computed from the file's bytes. The artifact's own sha256 and
        size_bytes are the values the uploader declared. Read-only.
      required: [status, sha256, size_bytes, stored_uri, checked_at]
      properties:
        status:
          $ref: "#/components/schemas/ArtifactChecksumStatus"
        sha256:
          type: string
          nullable: true
          description: The sha256 of the bytes, set once they were read.
        size_bytes:
          type: integer
          format: int64
          nullable: true
          description: The size of the bytes, set once they were read.
        stored_uri:
          type: string
          nullable: true
          description: >-
            Our copy of an external file, kept only when the bytes match the declared sha256
            and size. Empty for files uploaded to our storage, whose uri already points there.
        checked_at:
          type: string
          format: date-time
          nullable: true

    ArtifactChecksumStatus:
      type: string
      description: >-
        pending: not checked yet, or waiting for a retry. verified: the bytes match the
        declared sha256 and size, or nothing was declared. mismatch: the declared sha256 or
        size differs. failed: the bytes could not be read.
      enum: [pending, verified, mismatch, failed]
      x-enum-varnames:
        [
          ArtifactChecksumStatusPending,
          ArtifactChecksumStatusVerified,
          ArtifactChecksumStatusMismatch,
          ArtifactChecksumStatusFailed,
        ]

    CreateRunRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        software_name:
          type: string
          nullable: true
        software_version:
          type: string
          nullable: true
        command:
          type: string
          nullable: true
        parameters:
          type: object
          additionalProperties: true
        metadata:
          $ref: "#/components/schemas/RunMetadata"
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateRunArtifactRequest"

    Run:
      type: object
      required: [id, name, parameters, metadata, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        software_name:
          type: string
          nullable: true
        software_version:
          type: string
          nullable: true
        command:
          type: string
          nullable: true
        parameters:
          type: object
          additionalProperties: true
        metadata:
          $ref: "#/components/schemas/RunMetadata"
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRunArtifactRequest:
      type: object
      required: [artifact_id, direction]
      properties:
        artifact_id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/RunArtifactDirection"
        position:
          type: integer
          nullable: true

    RunArtifact:
      type: object
      required: [run_id, artifact_id, direction]
      properties:
        run_id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/RunArtifactDirection"
        position:
          type: integer
          nullable: true

    CreateMetricRequest:
      type: object
      required: [id, key, value]
      description: >-
        A metric of a computed model names the software that produced it, or links with
        run_id to the run that did. A Deposited model's metrics may omit both: the
        archive accession is their provenance.
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/MetricKey"
        value:
          type: number
          format: double
          x-go-type: "*float64"
        software_name:
          type: string
          nullable: true
          description: Program that produced the value, for example PHENIX or MolProbity.
        software_version:
          type: string
          nullable: true
          description: Version of that program, where known.
        run_id:
          type: string
          format: uuid
          nullable: true
          description: A run in the same request, or of the same model revision, that produced the value.

    Metric:
      type: object
      required: [id, key, value, created_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/MetricKey"
        value:
          type: number
          format: double
        software_name:
          type: string
          nullable: true
          description: Program that produced the value; null when the metric does not name one.
        software_version:
          type: string
          nullable: true
        run_id:
          type: string
          format: uuid
          nullable: true
          description: The run that produced the value; null when the metric does not link one.
        created_at:
          type: string
          format: date-time

    ProteinSequence:
      type: object
      required: [id, source_artifact_id, record_index, header, sequence, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_artifact_id:
          type: string
          format: uuid
        record_index:
          type: integer
          minimum: 0
        header:
          type: string
        sequence:
          type: string
        created_at:
          type: string
          format: date-time

    RevisionState:
      type: string
      enum: [pending, in_review, active, rejected, archived]

    EntryState:
      type: string
      enum: [new, active, deleted]

    ModelState:
      type: string
      enum: [new, active, deleted]

    CreateEntryRevisionRequest:
      type: object
      description: >
        Changes to the entry itself. Model changes use the model revision API.
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/EntryRevisionChange"

    EntryRevisionChange:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          minProperties: 1
          properties:
            title:
              type: string
              minLength: 1
            thumbnail_image_url:
              type: string
              nullable: true
            change_summary:
              type: string
              nullable: true
            polymer_entities:
              $ref: "#/components/schemas/DepositorPolymerEntities"

    CreateModelRequest:
      type: object
      required: [model]
      properties:
        model:
          $ref: "#/components/schemas/CreateModelData"

    AddModelOperation:
      type: object
      required: [op, data]
      properties:
        op:
          type: string
          enum: [add]
        data:
          $ref: "#/components/schemas/AddModelData"

    AddModelData:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        thumbnail_image_url:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/ModelMetadata"
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CreateRunRequest"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/CreateMetricRequest"

    CreateModelData:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        thumbnail_image_url:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/ModelMetadata"
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CreateRunRequest"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/CreateMetricRequest"

    CreateModelRevisionRequest:
      type: object
      required: [model]
      properties:
        model:
          $ref: "#/components/schemas/ModelRevisionChange"

    ModelRevisionChange:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        thumbnail_image_url:
          type: string
          nullable: true
        change_summary:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        metadata:
          description: >
            Replaces the whole metadata object of the active revision, except residue_data:
            when this object leaves residue_data out, the active revision's residue data is kept,
            because responses return it beside metadata, never inside it.
          allOf:
            - $ref: "#/components/schemas/ModelMetadata"
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        artifacts:
          type: array
          description: Replaces the model revision's artifact set when present.
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        runs:
          type: array
          description: Replaces the model revision's run set when present.
          items:
            $ref: "#/components/schemas/CreateRunRequest"
        metrics:
          type: array
          description: Replaces the model revision's metric set when present.
          items:
            $ref: "#/components/schemas/CreateMetricRequest"

    SubmitRevisionRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [in_review]
          x-enum-varnames: [SubmitRevisionRequestStateInReview]

    CreateEntryRevisionAttributes:
      type: object
      required: [entry_id, revision_id, state, model_results]
      properties:
        entry_id:
          type: string
        revision_id:
          type: string
          format: uuid
        base_revision_id:
          type: string
          format: uuid
          nullable: true
        state:
          type: string
          enum: [in_review]
        model_results:
          type: array
          description: Model revisions in the same order as model_operations.
          items:
            $ref: "#/components/schemas/ModelOperationResult"

    ModelOperationResult:
      type: object
      required: [op, model_id, model_revision_id]
      properties:
        op:
          type: string
          enum: [add]
        model_id:
          type: string
        model_revision_id:
          type: string
          format: uuid

    CreateModelRevisionAttributes:
      type: object
      required: [entry_id, model_id, revision_id, state]
      properties:
        entry_id:
          type: string
        model_id:
          type: string
        revision_id:
          type: string
          format: uuid
        base_revision_id:
          type: string
          format: uuid
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/RevisionState"

    UpdateRevisionStateRequest:
      type: object
      description: Permission-controlled state update for a revision in `in_review`.
      required: [state]
      properties:
        state:
          type: string
          enum: [active, rejected]

    EntryRevisionGroupAttributes:
      type: object
      required: [entry, entry_revisions, model_revisions]
      properties:
        entry:
          $ref: "#/components/schemas/EntryInfoAttributes"
        entry_revisions:
          type: array
          items:
            $ref: "#/components/schemas/EntryRevisionSummaryAttributes"
        model_revisions:
          type: array
          items:
            $ref: "#/components/schemas/ModelRevisionSummaryAttributes"

    EntryRevisionSummaryAttributes:
      type: object
      required: [id, entry_id, state, entry_state, created_by, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Entry revision ID.
        entry_id:
          type: string
        parent_revision_id:
          type: string
          format: uuid
          nullable: true
        revision_number:
          type: integer
          minimum: 1
          nullable: true
        state:
          $ref: "#/components/schemas/RevisionState"
        entry_state:
          $ref: "#/components/schemas/EntryState"
        created_by:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ModelRevisionSummaryAttributes:
      type: object
      required: [id, entry_id, model_id, state, model_state, created_by, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Model revision ID.
        entry_id:
          type: string
        model_id:
          type: string
        idempotency_key:
          type: string
          nullable: true
        parent_revision_id:
          type: string
          format: uuid
          nullable: true
        revision_number:
          type: integer
          minimum: 1
          nullable: true
        state:
          $ref: "#/components/schemas/RevisionState"
        model_state:
          $ref: "#/components/schemas/ModelState"
        created_by:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EntryRevisionAttributes:
      allOf:
        - $ref: "#/components/schemas/EntryRevisionSummaryAttributes"
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          required: [protein_sequences, artifacts]
          properties:
            thumbnail_image_url:
              type: string
              nullable: true
            protein_sequences:
              type: array
              items:
                $ref: "#/components/schemas/ProteinSequence"
            artifacts:
              type: array
              items:
                $ref: "#/components/schemas/ArtifactAttributes"
            field_sources:
              $ref: "#/components/schemas/FieldSources"
    ModelRevisionAttributes:
      allOf:
        - $ref: "#/components/schemas/ModelRevisionSummaryAttributes"
        - type: object
          required: [metadata, residue_data, metrics, artifacts]
          properties:
            thumbnail_image_url:
              type: string
              nullable: true
            primary_artifact_id:
              type: string
              format: uuid
              nullable: true
            metadata:
              $ref: "#/components/schemas/ModelMetadata"
            residue_data:
              type: array
              items:
                $ref: "#/components/schemas/ResidueData"
            metrics:
              type: array
              items:
                $ref: "#/components/schemas/Metric"
            artifacts:
              type: array
              items:
                $ref: "#/components/schemas/ArtifactAttributes"
            field_sources:
              $ref: "#/components/schemas/FieldSources"

    FieldSources:
      type: object
      nullable: true
      description: >
        Where the values of the revision's archive-synced fields came from, keyed by JSON
        pointer into the revision (for example /title, /metadata/resolution, or /metrics/r_free
        for an archive metric). A field without a key was not typed by a depositor, so the
        archive sync may update it. Null for revisions stored before sources were recorded;
        those were imported from the archive. Read-only.
      additionalProperties:
        $ref: "#/components/schemas/FieldSource"

    FieldSource:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [rcsb, depositor]
          x-enum-varnames: [FieldSourceSourceRcsb, FieldSourceSourceDepositor]
          description: >
            rcsb: the value came from RCSB, either copied by the archive sync or sent on
            create equal to the archive's value; the archive sync keeps it current.
            depositor: a user set or changed the value, and the archive sync never overwrites it.
        accession:
          type: string
          description: The PDB ID the value was read from, for archive values.
        release:
          type: string
          description: The archive version the value was read from, such as 4.3, for archive values.
        retrieved_at:
          type: string
          format: date-time
          description: When the value was read from the archive.
