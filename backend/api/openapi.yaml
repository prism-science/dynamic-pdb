        entry_id:
          type: string
        created_by:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/ModelMetadata"
        residue_data:
          description: >
            Per-residue data. Returned only by the model detail endpoint
