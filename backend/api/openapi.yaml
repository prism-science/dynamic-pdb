      required: [active, proposed]
      properties:
        active:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReviewEntry"
        proposed:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReviewEntry"

    ModelReviewPair:
      type: object
      description: >
        Both sides of one model. `proposed` is always present - a model with
        nothing in review is not part of the submission.
      required: [model_id, active, proposed]
      properties:
        model_id:
          type: string
          format: uuid
        active:
          nullable: true
          allOf:
