    EntryCreatedByRelationship:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/EntryCreatedByIdentifier"

    EntryProteinSequencesRelationship:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EntryProteinSequenceIdentifier"

    EntryCreatedByIdentifier:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [users]
        id:
          type: string
          format: uuid

    EntryProteinSequenceIdentifier:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [protein_sequences]
        id:
          type: string
          format: uuid

    EntryProteinSequenceData:
      type: object
      required: [type, id, attributes, relationships]
      properties:
        type:
          type: string
          enum: [protein_sequences]
        id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/EntryProteinSequenceAttributes"
        relationships:
          $ref: "#/components/schemas/EntryProteinSequenceRelationships"

    EntryProteinSequenceAttributes:
      type: object
      required: [record_index, header, sequence, created_at]
      properties:
        record_index:
