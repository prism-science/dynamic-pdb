openapi: 3.0.3
info:
  title: dynamic-pdb backend API
  version: 0.0.0

paths:
  /livez:
    get:
      operationId: livez
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /v1/auth/github/exchange:
    post:
      operationId: exchangeGithubToken
      summary: Exchange a GitHub access token for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub access token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/github/code/exchange:
    post:
      operationId: exchangeGithubCode
      summary: Exchange a GitHub authorization code for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubCodeExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub authorization code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/entities:
    get:
      operationId: listEntities
      summary: List entities
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: experiment_id
          in: query
          description: Experiment ID to filter by.
          required: false
          schema:
            type: string
            format: uuid
        - name: types
          in: query
          description: Entity types to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EntityType"
        - name: levels
          in: query
          description: Entity levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EntityLevel"
        - name: limit
          in: query
          description: Maximum number of entities to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of entities to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entities found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    GitHubExchangeRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    GitHubCodeExchangeRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
        redirect_uri:
          type: string

    TokenResponse:
      type: object
      required: [token_type, access_token, expires_at, name, email, login]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
        login:
          type: string

    EntityType:
      type: string
      enum: [model, metrics]

    EntityLevel:
      type: string
      enum: [L0, L1, L2, L3]

    EntityListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entity"

    Entity:
      type: object
      required: [id, entry_id, type, name, payload, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        experiment_id:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: "#/components/schemas/EntityType"
        level:
          allOf:
            - $ref: "#/components/schemas/EntityLevel"
          nullable: true
        name:
          type: string
        payload:
          oneOf:
            - $ref: "#/components/schemas/ModelPayload"
            - $ref: "#/components/schemas/MetricsPayload"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ModelPayload:
      type: object
      required: [file_url]
      properties:
        file_url:
          type: string

    MetricsPayload:
      type: object
      properties:
        r_free:
          type: number
          format: double
        r_work:
          type: number
          format: double
        rscc:
          type: number
          format: double
        cc:
          type: number
          format: double
