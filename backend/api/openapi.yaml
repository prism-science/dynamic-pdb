openapi: 3.0.3
info:
  title: dynamic-pdb backend API
  version: 0.0.0

paths:
  /livez:
    get:
      operationId: livez
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /v1/auth/github/exchange:
    post:
      operationId: exchangeGithubToken
      summary: Exchange a GitHub access token for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub access token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/github/code/exchange:
    post:
      operationId: exchangeGithubCode
      summary: Exchange a GitHub authorization code for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubCodeExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub authorization code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files:
    post:
      operationId: createFileUpload
      summary: Create a file upload and presign its parts
      description: >
        Creates a multipart upload and returns a presigned PUT URL for every
        part. The client uploads each part, then calls the complete endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileUploadRequest"
      responses:
        "200":
          description: File upload created; presigned part URLs returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadGrantResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/complete:
    post:
      operationId: completeFileUpload
      summary: Complete a file upload
      description: >
        Assembles the uploaded parts into the final object. The client sends the
        part number and ETag returned by each part upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteFileUploadRequest"
      responses:
        "200":
          description: File upload completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteFileUploadResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/abort:
    post:
      operationId: abortFileUpload
      summary: Abort a file upload
      description: Cancels an in-progress file upload and discards any parts already uploaded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortFileUploadRequest"
      responses:
        "204":
          description: File upload aborted.
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries:
    get:
      operationId: listEntries
      summary: List entries
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of entries to skip.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: query
          in: query
          description: Text to search across entries, experiments, entities, and entity payloads.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Entries found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createEntry
      summary: Create entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "201":
          description: Entry created.
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}:
    get:
      operationId: getEntry
      summary: Get entry
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entry found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/experiments:
    get:
      operationId: listExperiments
      summary: List experiments
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of experiments to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of experiments to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Experiments found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/entries/{entry_id}/experiments/{experiment_id}:
    get:
      operationId: getExperiment
      summary: Get experiment
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: experiment_id
          in: path
          description: Experiment ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Experiment found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Experiment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/entities:
    get:
      operationId: listEntities
      summary: List entities
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: experiment_id
          in: query
          description: Experiment ID to filter by.
          required: false
          schema:
            type: string
            format: uuid
        - name: types
          in: query
          description: Entity types to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EntityType"
        - name: levels
          in: query
          description: Entity levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EntityLevel"
        - name: limit
          in: query
          description: Maximum number of entities to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of entities to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entities found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CreateFileUploadRequest:
      type: object
      required: [entry_id, entity_id, filename, size]
      properties:
        entry_id:
          type: string
          format: uuid
          description: Entry identifier that owns this file.
        experiment_id:
          type: string
          format: uuid
          nullable: true
          description: Experiment identifier for experiment-level files; null for entry-level files.
        entity_id:
          type: string
          format: uuid
          description: Entity identifier this file belongs to.
        filename:
          type: string
          minLength: 1
          description: Original filename to keep as the final object key suffix.
        size:
          type: integer
          format: int64
          description: Total size in bytes of the file to upload.

    FileUploadGrantResponse:
      type: object
      required: [key, upload_id, object_url, part_size, parts]
      properties:
        key:
          type: string
          description: Object key the assembled file will be stored under.
        upload_id:
          type: string
          description: Identifier of the initiated multipart upload; echoed back on complete and abort.
        object_url:
          type: string
          description: Stable object reference to store with the entry payload.
        part_size:
          type: integer
          format: int64
          description: Size in bytes of every part except the last; the client must slice the file at this boundary.
        parts:
          type: array
          description: Presigned PUT targets, one per part, in ascending part-number order.
          items:
            $ref: "#/components/schemas/FileUploadPart"

    FileUploadPart:
      type: object
      required: [part_number, url]
      properties:
        part_number:
          type: integer
          description: 1-based index of this part.
        url:
          type: string
          description: Presigned URL the client PUTs this part's bytes to.

    CompleteFileUploadRequest:
      type: object
      required: [key, upload_id, parts]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.
        parts:
          type: array
          description: The uploaded parts, each with the ETag object storage returned for it.
          items:
            $ref: "#/components/schemas/CompletedFileUploadPart"

    CompletedFileUploadPart:
      type: object
      required: [part_number, etag]
      properties:
        part_number:
          type: integer
          description: 1-based index of the part.
        etag:
          type: string
          description: ETag returned in the response header when the part was uploaded.

    CompleteFileUploadResponse:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Object key the completed file is stored under.

    AbortFileUploadRequest:
      type: object
      required: [key, upload_id]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.

    GitHubExchangeRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    GitHubCodeExchangeRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
        redirect_uri:
          type: string

    TokenResponse:
      type: object
      required: [token_type, access_token, expires_at, name, email, login]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
        login:
          type: string

    EntryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entry"

    CreateEntryRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        entities:
          type: array
          items:
            $ref: "#/components/schemas/CreateEntityRequest"
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/CreateExperimentRequest"

    Entry:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExperimentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"

    CreateExperimentRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        entities:
          type: array
          items:
            $ref: "#/components/schemas/CreateEntityRequest"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/CreateEntityRelationRequest"

    Experiment:
      type: object
      required: [id, entry_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EntityType:
      type: string
      enum: [data, metrics, model, program]

    EntityLevel:
      type: string
      enum: [L0, L1, L2, L3]

    EntityRelationType:
      type: string
      enum: [input_to, output_of, metrics_for]

    CreateEntityRequest:
      type: object
      required: [id, type, name, payload]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EntityType"
        level:
          allOf:
            - $ref: "#/components/schemas/EntityLevel"
          nullable: true
        name:
          type: string
          minLength: 1
        payload:
          oneOf:
            - $ref: "#/components/schemas/DataPayload"
            - $ref: "#/components/schemas/ModelPayload"
            - $ref: "#/components/schemas/MetricsPayload"
            - $ref: "#/components/schemas/ProgramPayload"

    CreateEntityRelationRequest:
      type: object
      required: [source_entity_id, target_entity_id, relation_type]
      properties:
        source_entity_id:
          type: string
          format: uuid
        target_entity_id:
          type: string
          format: uuid
        relation_type:
          $ref: "#/components/schemas/EntityRelationType"

    EntityListResponse:
      type: object
      required: [items, relations]
      properties:
        items:
          type: array
          description: Entities matching the requested filters.
          items:
            $ref: "#/components/schemas/Entity"
        relations:
          type: array
          description: Entity relations for the entry provenance graph.
          items:
            $ref: "#/components/schemas/EntityRelation"

    Entity:
      type: object
      required: [id, entry_id, type, name, payload, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        experiment_id:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: "#/components/schemas/EntityType"
        level:
          allOf:
            - $ref: "#/components/schemas/EntityLevel"
          nullable: true
        name:
          type: string
        payload:
          oneOf:
            - $ref: "#/components/schemas/DataPayload"
            - $ref: "#/components/schemas/ModelPayload"
            - $ref: "#/components/schemas/MetricsPayload"
            - $ref: "#/components/schemas/ProgramPayload"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EntityRelation:
      type: object
      required: [id, source_entity_id, target_entity_id, relation_type, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        source_entity_id:
          type: string
          format: uuid
        target_entity_id:
          type: string
          format: uuid
        relation_type:
          $ref: "#/components/schemas/EntityRelationType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ModelPayload:
      type: object
      required: [file_url]
      properties:
        file_url:
          type: string
        authors:
          type: array
          description: Names of the people or systems associated with this model.
          items:
            type: string
        affiliation:
          type: string
          description: Primary organization, lab, department, or institution associated with this model.
          nullable: true
        size:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true

    DataPayload:
      type: object
      required: [file_url]
      properties:
        file_url:
          type: string
        type:
          type: string
        authors:
          type: array
          description: Names of the people or systems associated with this data file.
          items:
            type: string
        affiliation:
          type: string
          description: Primary organization, lab, department, or institution associated with this data file.
          nullable: true
        size:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true

    ProgramPayload:
      type: object
      required: [name, version, description]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string

    MetricsPayload:
      type: object
      properties:
        r_free:
          type: number
          format: double
        r_work:
          type: number
          format: double
        rscc:
          type: number
          format: double
        cc:
          type: number
          format: double
