    DepositorPolymerEntities:
      type: array
      description: >
        Polymer-entity values the depositor supplies, matched to extracted entities by
        label_entity_id. Construct and mutations take precedence over extracted values;
        source_organisms is used only when extraction finds none.
      items:
        $ref: "#/components/schemas/DepositorPolymerEntity"

