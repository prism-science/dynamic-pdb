      required: [state, superseded_by]
      properties:
        state:
          type: string
          enum: [obsolete]
          x-enum-varnames: [EntryArchiveStatusStateObsolete]
          description: "obsolete: the archive obsoleted the entry, usually replacing it."
        obsoleted_at:
          type: string
          format: date-time
          description: When the archive obsoleted the entry.
        superseded_by:
          type: array
          description: The archive entries that replaced it; empty when the archive names none.
          items:
            $ref: "#/components/schemas/EntrySuccessor"

    EntrySuccessor:
      type: object
      required: [pdb_id]
      properties:
        pdb_id:
          type: string
        entry_id:
          type: string
          description: The registry entry for this PDB ID, when the registry has one.

    PolymerEntity:
      type: object
      required: [id, source_organisms, mutations, uniprot_mappings, created_at]
      properties:
        id:
          type: string
          format: uuid
        label_entity_id:
          type: string
        description:
          type: string
        source_organisms:
          type: array
          items:
            $ref: "#/components/schemas/PolymerEntityOrganism"
        construct:
          type: string
        mutations:
          type: array
          description: Substitution strings such as C54T, one per element.
          items:
            type: string
        mutations_raw:
          type: string
          description: >
            Mutation text exactly as the source gave it (for example "C54T, ENGINEERED MUTATION").
            Present when the text was read into mutations, so text that is not a plain
            substitution is not hidden by an empty list.
        mutations_status:
          type: string
          enum: [parsed, needs_review, none]
          description: >
            How much of mutations_raw is in mutations. parsed: every token is a substitution.
            needs_review: some token is not a plain substitution and is only in mutations_raw.
            none: the text names no mutation. Absent when the source gave no text.
        uniprot_mappings:
          type: array
          items:
            $ref: "#/components/schemas/PolymerEntityUniProtMapping"
        created_at:
          type: string
          format: date-time

    ResidueData:
      type: object
      required: [label_asym_id, label_seq_id]
      properties:
        label_asym_id:
          type: string
        label_seq_id:
          type: integer
        label_comp_id:
          type: string
        auth_asym_id:
          type: string
        auth_seq_id:
          type: integer
        pdbx_pdb_ins_code:
          type: string
        label_alt_id:
          type: string
        uniprot_position:
          type: string
        rscc:
          type: number
          format: double
        b_iso:
          type: number
          format: double
        occupancy:
          type: number
          format: double
        conformer_count:
          type: integer
        rmsf:
          type: number
          format: double

    PolymerEntityOrganism:
      type: object
      required: [scientific_name]
      properties:
        scientific_name:
          type: string
        ncbi_taxonomy_id:
          type: integer

    PolymerEntityUniProtMapping:
      type: object
      required: [accession, source]
      properties:
        accession:
