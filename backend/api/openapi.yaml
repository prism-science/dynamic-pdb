openapi: 3.0.3
info:
  title: Dynamic PDB API
  version: 1.0.0
  description: |
    Dynamic PDB exposes deposited structural biology data, derived models, the
    programs that produced them, and evaluation metrics through a versioned
    JSON:API interface.

    Published entries can be read without authentication. Mutating operations —
    including deposits, model submissions, and review decisions — require a
    bearer token obtained through GitHub sign-in.

    Every request and response is a JSON:API document: send and accept
    `application/vnd.api+json`.
servers:
  - url: https://dynamicpdb.com/api
    description: Production

tags:
  - name: Entries
    description: |
      An entry groups the raw data, the models built from it, and the metrics
      measured against them. Reads return the current active revision.
  - name: Models
    description: |
      Structural models produced outside the registry, each carrying its
      quality scores as a flat list of key and value.
  - name: Revisions
    description: Revision queues, diffs, and review decisions. Reviewer role only.
  - name: Files
    description: |
      Multipart upload. Bytes never pass through the API — the client
      presigns, PUTs each part, then completes or aborts the upload.
  - name: Users
    description: Your own revisions and the state review left them in.
  - name: Authentication
    description: Exchanging a GitHub authorization for a backend JWT.
  - name: Artifacts
    description: Reading values out of uploaded artifact files.
  - name: Archive
    description: Looking up what the PDB archive says about an entry before it is imported.
  - name: Health
    x-scalar-ignore: true
    description: Liveness and readiness probes.

paths:
  /openapi.yaml:
    get:
      tags: [Health]
      operationId: getOpenAPISpec
      summary: OpenAPI description
      x-scalar-ignore: true
      responses:
        "200":
          description: OpenAPI description.
          content:
            application/yaml:
              schema:
                type: string

  /livez:
    get:
      tags: [Health]
      operationId: livez
      x-scalar-ignore: true
      responses:
        "200":
          description: Service is alive.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProbeDocument"

  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      x-scalar-ignore: true
      responses:
        "200":
          description: Service is ready.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProbeDocument"
        "503":
          description: Service is not ready.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProbeDocument"

  /v1/auth/github/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeGithubToken
      summary: Exchange GitHub token
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/GitHubExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub access token is invalid or expired.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/github/code/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeGithubCode
      summary: Exchange GitHub code
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/GitHubCodeExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub authorization code is invalid or expired.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/archive/pdb/{pdb_id}:
    get:
      tags: [Archive]
      operationId: getArchivePdb
      summary: Look up a PDB entry in the archive
      description: |
        Reads a PDB entry from RCSB and returns the values Dynamic PDB would
        store for the entry, its model, and its polymer entities, each with the
        RCSB field it was read from. Nothing is stored.

        The proposed values are checked with the same schema rules as writes.
        Violations, conflicting RCSB records, and values that were dropped come
        back as `warnings` — the lookup does not fail because of them.
        Responses are cached for a few minutes and RCSB is given 10 seconds.
      security:
        - bearerAuth: []
      parameters:
        - name: pdb_id
          in: path
          description: Four-character PDB ID, for example `4HHB`. Case is ignored.
          required: true
          schema:
            type: string
            pattern: "^[0-9][A-Za-z0-9]{3}$"
      responses:
        "200":
          description: Proposed values for the PDB entry.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ArchivePdbDocument"
        "400":
          description: The PDB ID is malformed.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: RCSB has no such entry.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: RCSB failed or did not answer in time.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/artifacts/{id}/extract:
    post:
      tags: [Artifacts]
      operationId: extractArtifact
      summary: Extract values from an uploaded structure file
      description: |
        Reads the start of the artifact's uploaded mmCIF file and returns the
        values Dynamic PDB would store for it: atom count, modeled residues,
        protein chains, altloc fraction, ligands, cofactors, engineered
        mutations and the refinement program. Nothing is stored.

        Only the first 4 MiB of the object is read (a ranged S3 GET). The
        connection, entity and mutation tables sit before the coordinates in
        archive files, so they are read in full; when the coordinates run past
        the limit, the values that need every atom are left out and a warning
        says so.

        Every value carries `source: file:<sha256>` of the artifact. Values
        that cannot be extracted, or fail the schema rules, come back as
        `warnings`; the request does not fail because of them. Values the
        parser is unsure about, such as metal ions in a file without `metalc`
        rows, are returned with `needs_review: true`.

        While the reference lists in `lib/cif` are drafts (not approved by
        researchers), only water is dropped from `ligands`; other solvents and
        buffers are kept and flagged `needs_review`, and every response carries a
        warning saying so.

        Parsing has a time budget of 5 seconds per request. If it runs out, the
        response is still 200: the values found so far come back with the warning
        `parser limit: time budget exceeded: the rest of the file was not read`,
        and the values that need the whole file (atom count, modeled residues,
        protein chains, altloc fraction) are left out, as for a truncated read.
        The extraction slot is released either way.

        Allowed for the user who created the artifact and for reviewers. Each
        user may make 10 extraction requests per minute and each server instance
        runs at most 2 extractions at once; past those limits the response is
        429 or 503 with a `Retry-After` header.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Artifact ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Extracted values.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ArtifactExtractionDocument"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller neither created the artifact nor is a reviewer.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Artifact not found, or nothing is stored at its URI.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The artifact is not an uploaded mmCIF file with a sha256.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The user made too many extraction requests in the last minute. `Retry-After` gives seconds.
          headers:
            Retry-After:
              description: Seconds to wait before extracting again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The object could not be read from storage.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Every extraction slot of this server instance is busy. `Retry-After` gives seconds.
          headers:
            Retry-After:
              description: Seconds to wait before extracting again.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files:
    post:
      tags: [Files]
      operationId: createFileUpload
      summary: Create file upload
      description: >
        Creates a multipart upload and returns a presigned PUT URL for every
        part. The client uploads each part, then calls the complete endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateFileUploadRequest"
      responses:
        "200":
          description: File upload created; presigned part URLs returned.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/FileUploadGrantDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File exceeds the configured upload size limit.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/files/complete:
    post:
      tags: [Files]
      operationId: completeFileUpload
      summary: Complete file upload
      description: >
        Assembles the uploaded parts into the final object. The client sends the
        part number and ETag returned by each part upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CompleteFileUploadRequest"
      responses:
        "200":
          description: File upload completed.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CompleteFileUploadDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/abort:
    post:
      tags: [Files]
      operationId: abortFileUpload
      summary: Abort file upload
      description: Cancels an in-progress file upload and discards any parts already uploaded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/AbortFileUploadRequest"
      responses:
        "204":
          description: File upload aborted.
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/{entry_id}.fasta:
    get:
      tags: [Files]
      operationId: getEntryFile
      summary: Download the canonical entry FASTA file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active entry or canonical FASTA artifact not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: More than one canonical FASTA artifact exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Artifact location could not be resolved.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags: [Files]
      operationId: headEntryFile
      summary: Resolve the canonical entry FASTA file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active entry or canonical FASTA artifact not found.
        "409":
          description: More than one canonical FASTA artifact exists.
        "502":
          description: Artifact location could not be resolved.

  /v1/files/{entry_id}/{model_id}/{filename}:
    get:
      tags: [Files]
      operationId: getModelFile
      summary: Download a canonical model file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          description: |
            RCSB-style filename derived from `entry_id`: `<entry_id>.cif`
            or `<entry_id>-sf.cif`.
          schema:
            type: string
          example: pdb_1000axyz.cif
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active model or canonical artifact not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: More than one canonical artifact exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Artifact location could not be resolved.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags: [Files]
      operationId: headModelFile
      summary: Resolve a canonical model file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          description: |
            RCSB-style filename derived from `entry_id`: `<entry_id>.cif`
            or `<entry_id>-sf.cif`.
          schema:
            type: string
          example: pdb_1000axyz.cif
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active model or canonical artifact not found.
        "409":
          description: More than one canonical artifact exists.
        "502":
          description: Artifact location could not be resolved.

  /v1/entries/{entry_id}:
    get:
      tags: [Entries]
      operationId: getEntry
      summary: Get entry
      description: Returns the current active revision of an entry.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entry found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryDocument"
        "404":
          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Entries]
      operationId: deleteEntry
      summary: Delete entry
      description: >
        Soft-deletes an entry. The server adds a revision that marks the entry deleted, without
        its PDB ID, and approves it at once, so the entry leaves every list, search and read
        endpoint and its PDB ID can be used by a new entry. Revisions of the entry and its models
        that are still pending or in review are rejected, and its archive sync jobs are stopped.
        Rows and files are kept. Only callers
        who can approve revisions may delete, and only on servers where entry deletion is turned
        on (dev).
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Entry deleted.
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Entry deletion is turned off on this server, or the caller cannot approve revisions.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found, or already deleted.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry changed while it was being deleted.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries:
    get:
      tags: [Entries]
      operationId: listEntries
      summary: List entries
      description: Lists entries from their current active revisions.
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: >
            Deprecated: use `cursor`. Number of entries to skip. Deep offsets get slower
            and can skip or repeat rows while data changes.
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the entries
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
        - name: query
          in: query
          description: Text to search across entries, models, artifacts, and artifact metadata.
          required: false
          schema:
            type: string
            maxLength: 256
        - name: pdb_id
          in: query
          description: PDB IDs to match against entry external_refs.pdb.
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 64
          style: form
          explode: true
      responses:
        "200":
          description: Entries found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryCollectionDocument"
        "400":
          description: Invalid filters.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Entries]
      operationId: createEntry
      summary: Create entry
      description: >
        Atomically creates a new entry, its initial in-review entry revision,
        and a separate in-review model revision for every add operation.
        When external_refs names a PDB ID, each archive-synced value that equals the
        archive's value for that entry is recorded as from the archive (field source rcsb,
        with accession and release), so the weekly archive sync keeps it current. Every
        other value is recorded as the depositor's, and so is every value when the archive
        lookup fails.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "201":
          description: Entry and initial in-review revision created.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CreateEntryRevisionDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The request breaks Dynamic PDB Schema rules. Every broken rule is listed, each with source.pointer.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry with the same active PDB reference already exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/similar-entries:
    get:
      tags: [Entries]
      operationId: listSimilarEntries
      summary: List similar entries
      description: Lists similar entries from their current active revisions.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Source entry ID.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of similar entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: >
            Deprecated: use `cursor`. Number of similar entries to skip. Deep offsets get slower
            and can skip or repeat rows while data changes.
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the similar entries
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Similar entries found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SimilarEntryCollectionDocument"
        "400":
          description: Invalid cursor.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/models:
    get:
      tags: [Models]
      operationId: listModelsAcrossEntries
      summary: List models
      description: Lists models from their current active revisions across active entries.
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of models to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: >
            Deprecated: use `cursor`. Number of models to skip. Deep offsets get slower
            and can skip or repeat rows while data changes.
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          description: >
            Opaque cursor from the previous page's `meta.next_cursor`. Returns the models
            that follow it. Follow `links.next` to page without building URLs.
            Cannot be combined with `offset`.
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Models found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelCollectionDocument"
        "400":
          description: Invalid filters.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models:
    post:
      tags: [Entries]
      operationId: createModel
      summary: Create entry model
      description: >
        Creates a model belonging to the entry and its initial in-review model
        revision. No entry revision is created.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
