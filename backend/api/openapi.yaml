    ModelMetadata:
      type: object
      description: >
        Model metadata. Keys outside this list get 422; open data goes in extensions. Keys starting with "__" are reserved. The list
        fields distinguish unknown (null or omitted) from known empty ([]).
      additionalProperties: false
      x-go-type: map[string]interface{}
      properties:
        external_refs:
          type: object
          additionalProperties:
            type: string
        details:
          type: string
        authors:
          type: array
          nullable: true
          items:
            type: string
        affiliation:
          type: string
        purpose:
          $ref: "#/components/schemas/ModelPurpose"
        model_type:
          $ref: "#/components/schemas/StructureModelType"
        origin:
          type: string
          enum: [archive]
          description: >
            Set for an unchanged archive deposition whose model_type describes its representation,
            such as a re-refinement deposited as an Ensemble. Requires external_refs.pdb and a model
            file linking RCSB's coordinate file for it. Exempts the model from the rules for computed
            models, as model_type Deposited does.
        related_entries:
          type: array
          description: The model's `_pdbx_database_related` rows.
          items:
            $ref: "#/components/schemas/RelatedEntry"
        atom_count:
          type: integer
          minimum: 0
        modeled_residues:
          type: integer
          minimum: 0
        unique_protein_chains:
          type: integer
          minimum: 0
        altloc_fraction:
          type: number
          format: double
          minimum: 0
          maximum: 1
        member_count:
          type: integer
          minimum: 2
          description: >
            How many whole-model states an Ensemble holds: its MODEL frames, or the altloc letters on
            every polymer residue. Omitted when the file could not be read to the end. Not a measure
            of quality.
        unmodeled_fraction:
          type: number
          format: double
          minimum: 0
          maximum: 1
        ligands:
          type: array
          nullable: true
          deprecated: true
          description: >
            Typed list of the model's ligands; for an archive model, RCSB's
            nonpolymer_bound_components. Kept for models whose file the server does not read
            (modeled_compounds not_stored); for any other, modeled_compounds (read from the file)
            is the record. Still accepted, so released CLIs keep working.
          items:
            type: string
        cofactors:
          type: array
          nullable: true
          deprecated: true
          description: >
            Typed list of the model's cofactors. Kept for models whose file the server does not
            read (modeled_compounds not_stored); for any other, modeled_compounds (read from the
            file) is the record. Still accepted, so released CLIs keep working.
          items:
            type: string
        residue_data:
          type: array
          items:
            $ref: "#/components/schemas/ResidueData"
        extensions:
          $ref: "#/components/schemas/Extensions"

    ArtifactMetadata:
      type: object
      description: >
        Artifact metadata. Keys outside this list get 422; open data goes in extensions. Keys starting with "__" are reserved.
      additionalProperties: false
      x-go-type: map[string]interface{}
      properties:
        records:
          type: array
          description: FASTA records.
          items:
            type: object
            required: [header, sequence]
            additionalProperties: false
            properties:
              header:
                type: string
              sequence:
                type: string
        _dynamic_pdb_source:
          type: object
