          format: uuid
        direction:
          $ref: "#/components/schemas/RunArtifactDirection"
        position:
          type: integer
          nullable: true

    CreateMetricRequest:
      type: object
      required: [id, key, value]
      description: >-
        A metric of a computed model names the software that produced it, or links with
        run_id to the run that did. A Deposited model's metrics may omit both: the
        archive accession is their provenance.
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/MetricKey"
        value:
          type: number
          format: double
          x-go-type: "*float64"
        software_name:
          type: string
          nullable: true
          description: Program that produced the value, for example PHENIX or MolProbity.
        software_version:
          type: string
          nullable: true
          description: Version of that program, where known.
        run_id:
          type: string
          format: uuid
          nullable: true
          description: A run in the same request, or of the same model revision, that produced the value.

    Metric:
      type: object
      required: [id, key, value, created_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/MetricKey"
        value:
          type: number
          format: double
        software_name:
          type: string
          nullable: true
          description: Program that produced the value; null when the metric does not name one.
        software_version:
          type: string
          nullable: true
        run_id:
          type: string
          format: uuid
          nullable: true
          description: The run that produced the value; null when the metric does not link one.
        created_at:
          type: string
          format: date-time

    ProteinSequence:
      type: object
      required: [id, source_artifact_id, record_index, header, sequence, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_artifact_id:
          type: string
          format: uuid
        record_index:
          type: integer
          minimum: 0
        header:
          type: string
        sequence:
          type: string
        created_at:
          type: string
          format: date-time

    RevisionState:
      type: string
      enum: [pending, in_review, active, rejected, archived]

    EntryState:
      type: string
      enum: [new, active, deleted]

    ModelState:
      type: string
      enum: [new, active, deleted]

    CreateEntryRevisionRequest:
      type: object
      description: >
        Changes to the entry itself. Model changes use the model revision API.
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/EntryRevisionChange"

    EntryRevisionChange:
      allOf:
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          minProperties: 1
          properties:
            title:
              type: string
              minLength: 1
            thumbnail_image_url:
              type: string
              nullable: true
            change_summary:
              type: string
              nullable: true
            polymer_entities:
              $ref: "#/components/schemas/DepositorPolymerEntities"

    CreateModelRequest:
      type: object
      required: [model]
      properties:
        model:
          $ref: "#/components/schemas/CreateModelData"

    AddModelOperation:
      type: object
      required: [op, data]
      properties:
        op:
          type: string
          enum: [add]
        data:
          $ref: "#/components/schemas/AddModelData"

    AddModelData:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        thumbnail_image_url:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/ModelMetadata"
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CreateRunRequest"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/CreateMetricRequest"
        value_sources:
          $ref: "#/components/schemas/ValueSources"

    CreateModelData:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        thumbnail_image_url:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/ModelMetadata"
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CreateRunRequest"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/CreateMetricRequest"
        value_sources:
          $ref: "#/components/schemas/ValueSources"

    CreateModelRevisionRequest:
      type: object
      required: [model]
      properties:
        model:
          $ref: "#/components/schemas/ModelRevisionChange"

    ModelRevisionChange:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        thumbnail_image_url:
          type: string
          nullable: true
        change_summary:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        metadata:
          description: >
            Replaces the whole metadata object of the active revision, except residue_data:
            when this object leaves residue_data out, the active revision's residue data is kept,
            because responses return it beside metadata, never inside it.
          allOf:
            - $ref: "#/components/schemas/ModelMetadata"
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        artifacts:
          type: array
          description: >
            Replaces the model revision's artifact set when present. To keep a stored artifact,
            send it back with its id and the values the API returned; it is linked as stored.
            Stored artifacts cannot change: a stored id sent with other values, or the id of an
            artifact the active revision does not have, is a 409.
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        runs:
          type: array
          description: >
            Replaces the model revision's run set when present. To keep a stored run, send it
            back with its id, the values the API returned and its artifact links; it is linked as
            stored. Stored runs cannot change: a stored id sent with other values, or the id of a
            run the active revision does not have, is a 409.
          items:
            $ref: "#/components/schemas/CreateRunRequest"
        metrics:
          type: array
          description: >
            Replaces the model revision's metric set when present. To keep a stored metric, send
            it back with its id and the values the API returned; it is linked as stored. Stored
            metrics cannot change: a stored id sent with other values, or the id of a metric the
            active revision does not have, is a 409.
          items:
            $ref: "#/components/schemas/CreateMetricRequest"

    SubmitRevisionRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [in_review]
          x-enum-varnames: [SubmitRevisionRequestStateInReview]

    CreateEntryRevisionAttributes:
      type: object
      required: [entry_id, revision_id, state, model_results]
      properties:
        entry_id:
          type: string
        revision_id:
          type: string
          format: uuid
        base_revision_id:
          type: string
          format: uuid
          nullable: true
        state:
          type: string
          enum: [in_review]
        model_results:
          type: array
          description: Model revisions in the same order as model_operations.
          items:
            $ref: "#/components/schemas/ModelOperationResult"

    ModelOperationResult:
      type: object
      required: [op, model_id, model_revision_id]
      properties:
        op:
          type: string
          enum: [add]
        model_id:
          type: string
        model_revision_id:
          type: string
          format: uuid

    CreateModelRevisionAttributes:
      type: object
      required: [entry_id, model_id, revision_id, state]
      properties:
        entry_id:
          type: string
        model_id:
          type: string
        revision_id:
          type: string
          format: uuid
        base_revision_id:
          type: string
          format: uuid
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/RevisionState"

    UpdateRevisionStateRequest:
      type: object
      description: Permission-controlled state update for a revision in `in_review`.
      required: [state]
      properties:
        state:
          type: string
          enum: [active, rejected]

    EntryRevisionGroupAttributes:
      type: object
      required: [entry, entry_revisions, model_revisions]
      properties:
        entry:
          $ref: "#/components/schemas/EntryInfoAttributes"
        entry_revisions:
          type: array
          items:
            $ref: "#/components/schemas/EntryRevisionSummaryAttributes"
        model_revisions:
          type: array
          items:
            $ref: "#/components/schemas/ModelRevisionSummaryAttributes"

    EntryRevisionSummaryAttributes:
      type: object
      required: [id, entry_id, state, entry_state, created_by, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Entry revision ID.
        entry_id:
          type: string
        parent_revision_id:
          type: string
          format: uuid
          nullable: true
        revision_number:
          type: integer
          minimum: 1
          nullable: true
        state:
          $ref: "#/components/schemas/RevisionState"
        entry_state:
          $ref: "#/components/schemas/EntryState"
        created_by:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ModelRevisionSummaryAttributes:
      type: object
      required: [id, entry_id, model_id, state, model_state, created_by, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Model revision ID.
        entry_id:
          type: string
        model_id:
          type: string
        idempotency_key:
          type: string
          nullable: true
        parent_revision_id:
          type: string
          format: uuid
          nullable: true
        revision_number:
          type: integer
          minimum: 1
          nullable: true
        state:
          $ref: "#/components/schemas/RevisionState"
        model_state:
          $ref: "#/components/schemas/ModelState"
        created_by:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EntryRevisionAttributes:
      allOf:
        - $ref: "#/components/schemas/EntryRevisionSummaryAttributes"
        - $ref: "#/components/schemas/EntryProperties"
        - type: object
          required: [protein_sequences, artifacts]
          properties:
            thumbnail_image_url:
              type: string
              nullable: true
            protein_sequences:
              type: array
              items:
                $ref: "#/components/schemas/ProteinSequence"
            artifacts:
              type: array
              items:
                $ref: "#/components/schemas/ArtifactAttributes"
            field_sources:
              $ref: "#/components/schemas/FieldSources"
            compound_sources:
              $ref: "#/components/schemas/CompoundSources"
            glycan_descriptors:
              $ref: "#/components/schemas/GlycanDescriptors"
    ModelRevisionAttributes:
      allOf:
        - $ref: "#/components/schemas/ModelRevisionSummaryAttributes"
        - type: object
          required: [metadata, residue_data, metrics, artifacts, modeled_compounds]
          properties:
            thumbnail_image_url:
              type: string
              nullable: true
            primary_artifact_id:
              type: string
              format: uuid
              nullable: true
            metadata:
              $ref: "#/components/schemas/ModelMetadata"
            residue_data:
              type: array
              items:
                $ref: "#/components/schemas/ResidueData"
            metrics:
              type: array
              items:
                $ref: "#/components/schemas/Metric"
            artifacts:
              type: array
              items:
                $ref: "#/components/schemas/ArtifactAttributes"
            field_sources:
              $ref: "#/components/schemas/FieldSources"
            modeled_compounds:
              $ref: "#/components/schemas/ModeledCompounds"

    CompoundSources:
      type: object
      nullable: true
      required: [ligands, cofactors, excluded]
      description: >
        The decision record of the revision's ligands and cofactors, as the mmCIF extraction
        derived them: the groups ligands, cofactors and excluded (compounds left out of both
        lists), each mapping a CCD ID to the rule that placed it. Water and polymer residues are
        never recorded. A compound a person added to a list has rule depositor; one they removed
        is no longer in its group. Null when the lists were not derived from a file. Read-only.
      properties:
        ligands:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CompoundSource"
        cofactors:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CompoundSource"
        excluded:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CompoundSource"
      example:
        ligands:
          NAG: {rule: branched, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}
          SO4: {rule: list, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0", review_reason: "often from the buffer: confirm it is part of the sample"}
          LIG: {rule: depositor}
        cofactors:
          ZN: {rule: metalc, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}
        excluded:
          GOL: {rule: list, list_version: "cofactors:2026.10.0+metals:2026.10.0+solvents:2026.10.0+covalent:2026.10.0+ccd-types:2026.10.0"}

    CompoundSource:
      type: object
      required: [rule]
      properties:
        rule:
          type: string
          enum: [list, metalc, branched, macrolide, ccd_type, depositor_flag, covalent_map, ihm_probe, depositor]
          x-enum-varnames:
            - CompoundSourceRuleList
            - CompoundSourceRuleMetalc
            - CompoundSourceRuleBranched
            - CompoundSourceRuleMacrolide
            - CompoundSourceRuleCcdType
            - CompoundSourceRuleDepositorFlag
            - CompoundSourceRuleCovalentMap
            - CompoundSourceRuleIhmProbe
            - CompoundSourceRuleDepositor
          description: >
            The rule that placed the compound (see docs/cif-extraction.md), or depositor for a
            compound a person added.
        list_version:
          type: string
          description: The reference list version the parser applied. Absent for rule depositor.
        review_reason:
          type: string
          description: >
            Why the parser flagged the compound for review, such as a metal ion in a file
            without metalc rows. Absent when nothing was flagged.

    GlycanDescriptors:
      type: array
      nullable: true
      description: >
        One glycan per branched entity of the entry's mmCIF, with the WURCS descriptors that keep
        the branching a list of CCD IDs loses. Empty when the file has no branched entity; null
        when it was not read. Read-only.
      items:
        $ref: "#/components/schemas/Glycan"

    Glycan:
      type: object
      required: [entity_id, compound_ids, descriptors]
      properties:
        entity_id:
          type: string
        compound_ids:
          type: array
          items:
            type: string
        descriptors:
          type: array
          items:
            $ref: "#/components/schemas/GlycanDescriptor"
      example:
        entity_id: "2"
        compound_ids: [BMA, NAG]
        descriptors:
          - descriptor: "WURCS=2.0/2,3,2/[a2122h-1b_1-5_2*NCC/3=O][a1122h-1b_1-5]/1-1-2/a4-b1_b4-c1"
            type: WURCS
            program: PDB2Glycan
            program_version: "1.1.0"

    GlycanDescriptor:
      type: object
      required: [descriptor, type]
      properties:
        descriptor:
          type: string
        type:
          type: string
        program:
          type: string
        program_version:
          type: string

    ValueSources:
      type: object
      description: >
        Optional. Names the uploaded file each value of this request was read from, keyed by
        the JSON pointer of the field, as in `field_sources` (for example /metrics/r_free or
        /metadata/authors). The value is then recorded with source `file` and the file's
        artifact ID and SHA-256, instead of `depositor`. Each key must be a field whose source
        is recorded and that this request sets, and the artifact must be the request's
        primary artifact (the model's own coordinate file) with a SHA-256: a model's scores
        and attribution are read only from the model's own file, never from an input of
        one of its runs. Otherwise the request is invalid (422 in enforce mode).
      additionalProperties:
        $ref: "#/components/schemas/ValueSource"

    ValueSource:
      type: object
      required: [artifact_id]
      properties:
        artifact_id:
          type: string
          format: uuid
          description: An artifact of the same request.

    FieldSources:
      type: object
      nullable: true
      description: >
        Where the values of the revision's archive-synced fields came from, keyed by JSON
        pointer into the revision (for example /title, /metadata/resolution, or /metrics/r_free
        for an archive metric). A field without a key was not typed by a depositor, so the
        archive sync may update it. Null for revisions stored before sources were recorded;
        those were imported from the archive. Read-only.
      additionalProperties:
        $ref: "#/components/schemas/FieldSource"

    FieldSource:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [rcsb, depositor, file]
          x-enum-varnames: [FieldSourceSourceRcsb, FieldSourceSourceDepositor, FieldSourceSourceFile]
          description: >
            rcsb: the value came from RCSB, either copied by the archive sync or sent on
            create equal to the archive's value; the archive sync keeps it current.
            depositor: a user set or changed the value, and the archive sync never overwrites it.
            file: a user sent the value as read from a file they uploaded with the revision
            (see `value_sources` on the create requests); `artifact_id` and `sha256` name the
            file. Like a depositor's value, the archive sync never overwrites it.
        artifact_id:
          type: string
          format: uuid
          description: The artifact the value was read from, for file values.
        sha256:
          type: string
          description: The SHA-256 of that artifact as it was uploaded, for file values.
        accession:
          type: string
          description: The PDB ID the value was read from, for archive values.
        release:
          type: string
          description: The archive version the value was read from, such as 4.3, for archive values.
        retrieved_at:
          type: string
          format: date-time
          description: When the value was read from the archive.
