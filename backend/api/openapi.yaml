openapi: 3.0.3
info:
  title: Dynamic PDB API
  version: 1.0.0
  description: |
    Dynamic PDB exposes deposited structural biology data, derived models, the
    programs that produced them, and evaluation metrics through a versioned
    JSON:API interface.

    Published entries can be read without authentication. Mutating operations —
    including deposits, model submissions, and review decisions — require a
    bearer token obtained through GitHub sign-in.

    Every request and response is a JSON:API document: send and accept
    `application/vnd.api+json`.
servers:
  - url: https://dynamicpdb.com/api
    description: Production

tags:
  - name: Entries
    description: |
      An entry groups the raw data, the models built from it, and the metrics
      measured against them. Reads return the current active revision.
  - name: Models
    description: |
      Structural models produced outside the registry, each carrying its
      quality scores as a flat list of key and value.
  - name: Revisions
    description: Revision queues, diffs, and review decisions. Reviewer role only.
  - name: Files
    description: |
      Multipart upload. Bytes never pass through the API — the client
      presigns, PUTs each part, then completes or aborts the upload.
  - name: Users
    description: Your own revisions and the state review left them in.
  - name: Authentication
    description: Exchanging a GitHub authorization for a backend JWT.
  - name: Health
    x-scalar-ignore: true
    description: Liveness and readiness probes.

paths:
  /openapi.yaml:
    get:
      tags: [Health]
      operationId: getOpenAPISpec
      summary: OpenAPI description
      x-scalar-ignore: true
      responses:
        "200":
          description: OpenAPI description.
          content:
            application/yaml:
              schema:
                type: string

  /livez:
    get:
      tags: [Health]
      operationId: livez
      x-scalar-ignore: true
      responses:
        "200":
          description: Service is alive.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProbeDocument"

  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      x-scalar-ignore: true
      responses:
        "200":
          description: Service is ready.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProbeDocument"
        "503":
          description: Service is not ready.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProbeDocument"

  /v1/auth/github/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeGithubToken
      summary: Exchange GitHub token
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/GitHubExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub access token is invalid or expired.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/github/code/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeGithubCode
      summary: Exchange GitHub code
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/GitHubCodeExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub authorization code is invalid or expired.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files:
    post:
      tags: [Files]
      operationId: createFileUpload
      summary: Create file upload
      description: >
        Creates a multipart upload and returns a presigned PUT URL for every
        part. The client uploads each part, then calls the complete endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateFileUploadRequest"
      responses:
        "200":
          description: File upload created; presigned part URLs returned.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/FileUploadGrantDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File exceeds the configured upload size limit.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/files/complete:
    post:
      tags: [Files]
      operationId: completeFileUpload
      summary: Complete file upload
      description: >
        Assembles the uploaded parts into the final object. The client sends the
        part number and ETag returned by each part upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CompleteFileUploadRequest"
      responses:
        "200":
          description: File upload completed.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CompleteFileUploadDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/abort:
    post:
      tags: [Files]
      operationId: abortFileUpload
      summary: Abort file upload
      description: Cancels an in-progress file upload and discards any parts already uploaded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/AbortFileUploadRequest"
      responses:
        "204":
          description: File upload aborted.
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/{entry_id}.fasta:
    get:
      tags: [Files]
      operationId: getEntryFile
      summary: Download the canonical entry FASTA file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active entry or canonical FASTA artifact not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: More than one canonical FASTA artifact exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Artifact location could not be resolved.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags: [Files]
      operationId: headEntryFile
      summary: Resolve the canonical entry FASTA file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active entry or canonical FASTA artifact not found.
        "409":
          description: More than one canonical FASTA artifact exists.
        "502":
          description: Artifact location could not be resolved.

  /v1/files/{entry_id}/{model_id}/{filename}:
    get:
      tags: [Files]
      operationId: getModelFile
      summary: Download a canonical model file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          description: |
            RCSB-style filename derived from `entry_id`: `<entry_id>.cif`
            or `<entry_id>-sf.cif`.
          schema:
            type: string
          example: pdb_1000axyz.cif
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active model or canonical artifact not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: More than one canonical artifact exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Artifact location could not be resolved.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags: [Files]
      operationId: headModelFile
      summary: Resolve a canonical model file
      security: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          description: |
            RCSB-style filename derived from `entry_id`: `<entry_id>.cif`
            or `<entry_id>-sf.cif`.
          schema:
            type: string
          example: pdb_1000axyz.cif
      responses:
        "302":
          description: Redirect to the current artifact location.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        "404":
          description: Active model or canonical artifact not found.
        "409":
          description: More than one canonical artifact exists.
        "502":
          description: Artifact location could not be resolved.

  /v1/entries/{entry_id}:
    get:
      tags: [Entries]
      operationId: getEntry
      summary: Get entry
      description: Returns the current active revision of an entry.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entry found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryDocument"
        "404":
          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries:
    get:
      tags: [Entries]
      operationId: listEntries
      summary: List entries
      description: Lists entries from their current active revisions.
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: Number of entries to skip.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: query
          in: query
          description: Text to search across entries, models, artifacts, and artifact metadata.
          required: false
          schema:
            type: string
            maxLength: 256
        - name: pdb_id
          in: query
          description: PDB IDs to match against entry metadata.external_refs.pdb.
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 64
          style: form
          explode: true
      responses:
        "200":
          description: Entries found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryCollectionDocument"
        "400":
          description: Invalid filters.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Entries]
      operationId: createEntry
      summary: Create entry
      description: >
        Atomically creates a new entry, its initial in-review entry revision,
        and a separate in-review model revision for every add operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "201":
          description: Entry and initial in-review revision created.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CreateEntryRevisionDocument"
        "400":
          description: Invalid request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry with the same active PDB reference already exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/similar-entries:
    get:
      tags: [Entries]
      operationId: listSimilarEntries
      summary: List similar entries
      description: Lists similar entries from their current active revisions.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Source entry ID.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of similar entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: Number of similar entries to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Similar entries found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SimilarEntryCollectionDocument"
        "404":
          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/models:
    get:
      tags: [Models]
      operationId: listModelsAcrossEntries
      summary: List models
      description: Lists models from their current active revisions across active entries.
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of models to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: Number of models to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Models found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelCollectionDocument"
        "400":
          description: Invalid filters.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models:
    post:
      tags: [Entries]
      operationId: createModel
      summary: Create entry model
      description: >
        Creates a model belonging to the entry and its initial in-review model
        revision. No entry revision is created.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
      responses:
        "201":
          description: Model and initial in-review revision created.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CreateModelRevisionDocument"
        "400":
          description: Invalid model data.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Model ID already exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Entries]
      operationId: listModels
      summary: List entry models
      description: Lists models from their current active revisions.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of models to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: Number of models to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Models found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelCollectionDocument"
        "400":
          description: Invalid filters.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}:
    get:
      tags: [Entries]
      operationId: getModel
      summary: Get entry model
      description: Returns the model's current active revision.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelDocument"
        "404":
          description: Model not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/artifacts:
    get:
      tags: [Entries]
      operationId: listArtifacts
      summary: List entry artifacts
      description: Lists artifacts from the entry's current active revision.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
        - name: levels
          in: query
          description: Artifact levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/ArtifactLevel"
        - name: limit
          in: query
          description: Maximum number of artifacts to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: Number of artifacts to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Artifacts found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ArtifactCollectionDocument"
        "400":
          description: Invalid filters.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}/artifacts:
    get:
      tags: [Entries]
      operationId: listModelArtifacts
      summary: List model artifacts
      description: Lists artifacts from the model's current active revision.
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
        - name: levels
          in: query
          description: Artifact levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/ArtifactLevel"
        - name: limit
          in: query
          description: Maximum number of artifacts to return.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: Number of artifacts to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Model artifacts found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ModelArtifactCollectionDocument"
        "400":
          description: Invalid filters.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/revisions:
    get:
      tags: [Revisions]
      operationId: listEntryRevisionGroups
      summary: List all revisions
      description: >
        Reviewer-only revision collection grouped by entry. An entry is returned
        when either an entry revision or one of its model revisions has the
        requested state. Each item contains only revisions matching that state.
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          description: Revision state to list.
          required: true
          schema:
            $ref: "#/components/schemas/RevisionState"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entries with matching revisions found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryRevisionGroupCollectionDocument"
        "400":
          description: Missing or invalid state filter.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller does not have the reviewer role.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/revisions:
    get:
      tags: [Revisions]
      operationId: listEntryRevisionsForEntry
      summary: List entry revisions
      description: Reviewer-only revision history of one entry.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entry revisions found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EntryRevisionSummaryCollectionDocument"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller does not have the reviewer role.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Revisions]
      operationId: createEntryRevision
      summary: Create entry revision
      description: >
        Creates an in-review revision containing changes to the entry itself.
        Model changes are created separately through the model revision API.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
