openapi: 3.0.3
info:
  title: dynamic-pdb backend API
  version: 0.0.0

paths:
  /livez:
    get:
      operationId: livez
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /v1/auth/github/exchange:
    post:
      operationId: exchangeGithubToken
      summary: Exchange a GitHub access token for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub access token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/github/code/exchange:
    post:
      operationId: exchangeGithubCode
      summary: Exchange a GitHub authorization code for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubCodeExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub authorization code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries:
    get:
      operationId: listEntries
      summary: List entries
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of entries to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entries found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}:
    get:
      operationId: getEntry
      summary: Get entry
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entry found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/experiments:
    get:
      operationId: listExperiments
      summary: List experiments
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of experiments to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of experiments to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Experiments found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/experiments/{experiment_id}:
    get:
      operationId: getExperiment
      summary: Get experiment
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: experiment_id
          in: path
          description: Experiment ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Experiment found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Experiment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/entities:
    get:
      operationId: listEntities
      summary: List entities
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: experiment_id
          in: query
          description: Experiment ID to filter by.
          required: false
          schema:
            type: string
            format: uuid
        - name: types
          in: query
          description: Entity types to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EntityType"
        - name: levels
          in: query
          description: Entity levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EntityLevel"
        - name: limit
          in: query
          description: Maximum number of entities to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of entities to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entities found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    GitHubExchangeRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    GitHubCodeExchangeRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
        redirect_uri:
          type: string

    TokenResponse:
      type: object
      required: [token_type, access_token, expires_at, name, email, login]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
        login:
          type: string

    EntryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entry"

    Entry:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExperimentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"

    Experiment:
      type: object
      required: [id, entry_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EntityType:
      type: string
      enum: [data, metrics, model, program]

    EntityLevel:
      type: string
      enum: [L0, L1, L2, L3]

    EntityRelationType:
      type: string
      enum: [input_to, output_of, metrics_for]

    EntityListResponse:
      type: object
      required: [items, relations]
      properties:
        items:
          type: array
          description: Entities matching the requested filters.
          items:
            $ref: "#/components/schemas/Entity"
        relations:
          type: array
          description: Entity relations for the entry provenance graph.
          items:
            $ref: "#/components/schemas/EntityRelation"

    Entity:
      type: object
      required: [id, entry_id, type, name, payload, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        experiment_id:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: "#/components/schemas/EntityType"
        level:
          allOf:
            - $ref: "#/components/schemas/EntityLevel"
          nullable: true
        name:
          type: string
        payload:
          oneOf:
            - $ref: "#/components/schemas/DataPayload"
            - $ref: "#/components/schemas/ModelPayload"
            - $ref: "#/components/schemas/MetricsPayload"
            - $ref: "#/components/schemas/ProgramPayload"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EntityRelation:
      type: object
      required: [id, source_entity_id, target_entity_id, relation_type, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        source_entity_id:
          type: string
          format: uuid
        target_entity_id:
          type: string
          format: uuid
        relation_type:
          $ref: "#/components/schemas/EntityRelationType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ModelPayload:
      type: object
      required: [file_url]
      properties:
        file_url:
          type: string
        size:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true

    DataPayload:
      type: object
      required: [file_url]
      properties:
        file_url:
          type: string
        type:
          type: string
        size:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true

    ProgramPayload:
      type: object
      required: [name, version, description]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string

    MetricsPayload:
      type: object
      properties:
        r_free:
          type: number
          format: double
        r_work:
          type: number
          format: double
        rscc:
          type: number
          format: double
        cc:
          type: number
          format: double
