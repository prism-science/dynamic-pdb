openapi: 3.0.3
info:
  title: dynamic-pdb backend API
  version: 0.0.0

paths:
  /livez:
    get:
      operationId: livez
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /v1/auth/github/exchange:
    post:
      operationId: exchangeGithubToken
      summary: Exchange a GitHub access token for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub access token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/github/code/exchange:
    post:
      operationId: exchangeGithubCode
      summary: Exchange a GitHub authorization code for a backend JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubCodeExchangeRequest"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub authorization code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account does not belong to any allowed organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files:
    post:
      operationId: createFileUpload
      summary: Create a file upload and presign its parts
      description: >
        Creates a multipart upload and returns a presigned PUT URL for every
        part. The client uploads each part, then calls the complete endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileUploadRequest"
      responses:
        "200":
          description: File upload created; presigned part URLs returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadGrantResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/files/complete:
    post:
      operationId: completeFileUpload
      summary: Complete a file upload
      description: >
        Assembles the uploaded parts into the final object. The client sends the
        part number and ETag returned by each part upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteFileUploadRequest"
      responses:
        "200":
          description: File upload completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteFileUploadResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/files/abort:
    post:
      operationId: abortFileUpload
      summary: Abort a file upload
      description: Cancels an in-progress file upload and discards any parts already uploaded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortFileUploadRequest"
      responses:
        "204":
          description: File upload aborted.
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries:
    get:
      operationId: listEntries
      summary: List entries
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of entries to skip.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: query
          in: query
          description: Text to search across entries, models, artifacts, and artifact metadata.
          required: false
          schema:
            type: string
        - name: pdb_id
          in: query
          description: PDB IDs to match against entry metadata.external_refs.pdb.
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: Entries found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createEntry
      summary: Create entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "201":
          description: Entry created.
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry with the same active PDB reference already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}:
    get:
      operationId: getEntry
      summary: Get entry
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entry found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEntry
      summary: Delete entry
      description: Deletes an entry and all nested models, revisions, and search rows. Only the entry creator can delete it.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Entry deleted.
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the entry creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models:
    get:
      operationId: listModels
      summary: List models
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of models to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of models to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Models found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createModel
      summary: Create model
      description: Adds a model, its artifacts, runs, relations, and metrics to an existing entry. Runs may reference artifacts created in this request or entry-level artifacts that already exist.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry the model belongs to.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
      responses:
        "201":
          description: Model created.
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}:
    get:
      operationId: getModel
      summary: Get model
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Model found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteModel
      summary: Delete model
      description: Deletes one model and its revisions. Only the model creator can delete it.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Model deleted.
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the model creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/artifacts:
    get:
      operationId: listArtifacts
      summary: List artifacts
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID to filter by.
          required: true
          schema:
            type: string
            format: uuid
        - name: levels
          in: query
          description: Artifact levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArtifactLevel"
        - name: limit
          in: query
          description: Maximum number of artifacts to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of artifacts to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Artifacts found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/entries/{entry_id}/models/{model_id}/artifacts:
    get:
      operationId: listModelArtifacts
      summary: List model artifacts
      security: []
      parameters:
        - name: entry_id
          in: path
          description: Entry ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: model_id
          in: path
          description: Model ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: levels
          in: query
          description: Artifact levels to include.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArtifactLevel"
        - name: limit
          in: query
          description: Maximum number of artifacts to return.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: Number of artifacts to skip.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Model artifacts found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelArtifactListResponse"
        "400":
          description: Invalid filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CreateFileUploadRequest:
      type: object
      required: [entry_id, artifact_id, filename, size]
      properties:
        entry_id:
          type: string
          format: uuid
          description: Entry identifier that owns this file.
        model_id:
          type: string
          format: uuid
          nullable: true
          description: Model identifier for model-level files; null for entry-level files.
        artifact_id:
          type: string
          format: uuid
          description: Artifact identifier this file belongs to.
        filename:
          type: string
          minLength: 1
          description: Original filename to keep as the final object key suffix.
        size:
          type: integer
          format: int64
          description: Total size in bytes of the file to upload.

    FileUploadGrantResponse:
      type: object
      required: [key, upload_id, object_url, part_size, parts]
      properties:
        key:
          type: string
          description: Object key the assembled file will be stored under.
        upload_id:
          type: string
          description: Identifier of the initiated multipart upload; echoed back on complete and abort.
        object_url:
          type: string
          description: Public HTTP object URL to store with the artifact.
        part_size:
          type: integer
          format: int64
          description: Size in bytes of every part except the last; the client must slice the file at this boundary.
        parts:
          type: array
          description: Presigned PUT targets, one per part, in ascending part-number order.
          items:
            $ref: "#/components/schemas/FileUploadPart"

    FileUploadPart:
      type: object
      required: [part_number, url]
      properties:
        part_number:
          type: integer
          description: 1-based index of this part.
        url:
          type: string
          description: Presigned URL the client PUTs this part's bytes to.

    CompleteFileUploadRequest:
      type: object
      required: [key, upload_id, parts]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.
        parts:
          type: array
          description: The uploaded parts, each with the ETag object storage returned for it.
          items:
            $ref: "#/components/schemas/CompletedFileUploadPart"

    CompletedFileUploadPart:
      type: object
      required: [part_number, etag]
      properties:
        part_number:
          type: integer
          description: 1-based index of the part.
        etag:
          type: string
          description: ETag returned in the response header when the part was uploaded.

    CompleteFileUploadResponse:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Object key the completed file is stored under.

    AbortFileUploadRequest:
      type: object
      required: [key, upload_id]
      properties:
        key:
          type: string
          description: Object key returned by the initiate call.
        upload_id:
          type: string
          description: Upload identifier returned by the initiate call.

    GitHubExchangeRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    GitHubCodeExchangeRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
        redirect_uri:
          type: string

    TokenResponse:
      type: object
      required: [token_type, access_token, expires_at, name, email, login]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
        login:
          type: string

    EntryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntryInfo"

    EntryInfo:
      type: object
      required: [id, created_by, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEntryRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        models:
          type: array
          items:
            $ref: "#/components/schemas/CreateModelRequest"

    Entry:
      type: object
      required: [id, created_by, name, metadata, created_at, updated_at, protein_sequences]
      properties:
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        protein_sequences:
          type: array
          items:
            $ref: "#/components/schemas/ProteinSequence"

    ModelListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    CreateModelRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CreateArtifactRequest"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CreateRunRequest"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/CreateMetricRequest"

    Model:
      type: object
      required: [id, entry_id, created_by, name, metadata, created_at, updated_at, metrics]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail_image_url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        primary_artifact_id:
          type: string
          format: uuid
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"

    ArtifactLevel:
      type: string
      enum: [L0, L1, L2, L3]

    RunArtifactDirection:
      type: string
      enum: [input, output]

    CreateArtifactRequest:
      type: object
      required: [id, name, level]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        level:
          $ref: "#/components/schemas/ArtifactLevel"
        uri:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    Artifact:
      type: object
      required: [id, name, level, metadata, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          $ref: "#/components/schemas/ArtifactLevel"
        uri:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    ArtifactListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"

    ModelArtifactListResponse:
      type: object
      required: [items, runs, relations]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/RunArtifact"

    CreateRunRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        software_name:
          type: string
          nullable: true
        software_version:
          type: string
          nullable: true
        command:
          type: string
          nullable: true
        parameters:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        artifacts:
          type: array
          items:
