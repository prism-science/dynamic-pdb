apiVersion: v1
kind: Service
metadata:
  name: dynamic-pdb-backend
  labels:
    {{- include "dynamic-pdb.labels" . | nindent 4 }}
    {{- include "dynamic-pdb.backend.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dynamic-pdb.backend.selectorLabels" . | nindent 4 }}
