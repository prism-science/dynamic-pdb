host: dynamicpdb.com

backend:
  image:
    repository: harbor.astera.sh/library/dynamic-pdb-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 8080
  dbSecretName: dynamic-pdb
  appSecretName: dynamic-pdb-backend
  s3SecretName: dynamic-pdb-s3-data
  auth:
    githubClientId: Ov23liRjWaMI9Ur5X57e
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

website:
  image:
    repository: harbor.astera.sh/library/dynamic-pdb-website
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 3000
  appBaseUrl: https://dynamicpdb.com
  publicApiBaseUrl: https://dynamicpdb.com/api
  auth:
    githubClientId: Ov23liRjWaMI9Ur5X57e
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

migrations:
  enabled: true
  image:
    repository: harbor.astera.sh/library/dynamic-pdb-migrations
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mmseqsJob:
  enabled: true
  # Temporary test cadence. Switch back to daily after production smoke testing.
  schedule: "0 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  image:
    repository: harbor.astera.sh/library/dynamic-pdb-mmseqs-job
    tag: latest
    pullPolicy: IfNotPresent
  cache:
    storageClassName: ebs-gp3
    size: 16Gi
    mountPath: /app/.tmp/mmseqs
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 16Gi

ingress:
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
