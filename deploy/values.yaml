    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 8080
  dbSecretName: ""
  appSecretName: ""
  s3SecretName: ""
  auth:
    githubClientId: Ov23liRjWaMI9Ur5X57e
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

website:
  image:
    repository: harbor.astera.sh/library/dynamic-pdb-website
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 3000
  appBaseUrl: https://dynamicpdb.com
  publicApiBaseUrl: https://dynamicpdb.com/api
  fileBaseUrl: https://files.dynamicpdb.com
  auth:
    githubClientId: Ov23liRjWaMI9Ur5X57e
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

s3proxy:
  image:
    repository: harbor.astera.sh/library/s3proxy
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  awsSecretName: ""
  s3:
    bucketName: dynamic-pdb-dynamicpdb-com
    region: us-west-1
    indexDocument: index.html
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

migrations:
  enabled: true
  image:
    repository: harbor.astera.sh/library/dynamic-pdb-migrations
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mmseqsJob:
  enabled: true
  schedule: "0 0 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  image:
    repository: harbor.astera.sh/library/dynamic-pdb-mmseqs-job
    tag: latest
    pullPolicy: IfNotPresent
  cache:
    storageClassName: ebs-gp3
    size: 16Gi
    mountPath: /app/.tmp/mmseqs
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 16Gi

# Hashes every artifact's bytes and copies verified external files into the bucket. It runs
# the backend image, so it always matches the deployed API. Paused after prod's database stalled
# on WAL writes at 22:04 UTC on 2026-10-27; turn it back on once the RDS metrics are understood.
checksumJob:
  enabled: false
  schedule: "0 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  backoffLimit: 0
  # The job stops claiming files after 50 minutes; this ends a run before the next one starts.
  activeDeadlineSeconds: 3300
  # Caps the files one run checks; 0 means no cap.
  maxFilesPerRun: 1000
  # The largest external file the job copies into the bucket; a larger one is still hashed and
  # keeps only its link (copy status over_limit). 1 GiB, the same as the upload limit, from the
  # researchers' round-1 answer. They asked for 2 GB on 2026-10-29; their answer to question A
  # sets this: 1 GB = 1000000000, 2 GB = 2000000000, 2 GiB = 2147483648.
  copyLimitBytes: 1073741824
  # Replaces the backend's 10s statement_timeout for the job only. Each statement that adds
  # missing rows looks at 2000 artifacts; this leaves room for a slow database and still stops
  # a statement that runs away.
  statementTimeout: 30s
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Reads every model file uploaded to our bucket and stores the compounds it models (T3-M), one
# file at a time, outside the API pods. A new upload is read at the next run, within about
# 5 minutes. A file that fails is retried after 10 and 20 minutes, then marked failed with the
# reason; failed runs alert nobody (job alerts are muted for this namespace), so the entry page
# shows the reason.
modelCompoundsJob:
  enabled: true
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  backoffLimit: 0
  # The job claims files for 4 minutes and gives each at most fileTimeout; this ends a run that
  # hangs after both.
  activeDeadlineSeconds: 900
  # Caps the files one run reads; 0 means no cap.
  maxFilesPerRun: 0
  fileTimeout: 10m
  # Gives the model files stored before the job existed their sets: on prod about 152,000
  # qFit and ensemble-refinement models (1.6 TB) from the August 2026 bulk import. Off at
  # first; turn it on after a quiet day with maxFilesPerRun: 100 (about 1,200 files an hour,
  # about 5 days), and raise the cap once RDS metrics and the job's logs look right. While it
  # is on, each run also pages through every artifact, 2,000 per statement, pausing as long
  # as each page took.
  historicalFill: false
  # The largest statement stores 2,000 copies of one file.
  statementTimeout: 30s
  # A 315 MB file read with a 13 MB peak on 2026-10-30; the limit leaves room for a decompressed
  # gzip stream and the database client.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

# The archive re-derivation job (T1-C2): derives the ligands, cofactors, decision record and
# glycans of archive entries, and their UniProt-numbered mutations, from the head of each RCSB
# mmCIF, in place on the active revision. Off until its prod run is planned; see the README.
archiveRederiveJob:
  enabled: false
  # Off-peak on prod: hourly from 22:00 to 05:00 UTC.
  schedule: "0 22-23,0-5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  backoffLimit: 0
  # The job stops taking pages after 50 minutes; this ends a run before the next one starts.
  activeDeadlineSeconds: 3300
  # Caps the revisions one run looks at; 0 means no cap.
  maxEntriesPerRun: 5000
  # Revisions one page derives before writing them, and RCSB downloads in flight.
  pageSize: 200
  downloadConcurrency: 4
  # true logs what the job would change, in rows marked dry_run, and changes nothing else.
  dryRun: false
  # Replaces the backend's 10s statement_timeout for the job only.
  statementTimeout: 30s
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

ingress:
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
