name: Build, Test and Deploy

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: harbor.astera.sh
  IMAGE_PREFIX: library
  BACKEND_COVERAGE_THRESHOLD: "30"
  WEBSITE_COVERAGE_THRESHOLD: "45"
  GOLANGCI_LINT_VERSION: "v2.11"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      cli: ${{ steps.filter.outputs.cli }}
      website: ${{ steps.filter.outputs.website }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - id: filter
        uses: dorny/paths-filter@v4.0.1
        with:
          filters: |
            backend:
              - ".github/workflows/build-test-deploy.yml"
              - ".golangci.yml"
              - "Makefile"
              - "go.work"
              - "go.work.sum"
              - "backend/**"
              - "lib/**"
            cli:
              - ".github/workflows/build-test-deploy.yml"
              - ".github/workflows/release.yml"
              - ".golangci.yml"
              - "Makefile"
              - "go.work"
              - "go.work.sum"
              - "cli/**"
              - "lib/**"
            website:
              - ".github/workflows/build-test-deploy.yml"
              - "website/**"
              - "lib/cif/*.json"
              - "lib/cif/testdata/**"
              - "backend/api/openapi.yaml"
            integration:
              - ".github/workflows/build-test-deploy.yml"
              - "Makefile"
              - "go.work"
              - "go.work.sum"
              - "backend/**"
              - "cli/**"
              - "lib/**"
              - "integration/**"
              # integration/form_parity_test.go reads the website's golden form requests.
              - "website/test/fixtures/form-parity-requests.json"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dynamic_pdb_local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 35432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dynamic_pdb_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/migrations/go.sum
            backend/tools/go.sum
            lib/go.sum

      - name: Install codegen tools
        run: make -C backend install-tools

      - name: Generate backend code
        run: PATH="$(go env GOPATH)/bin:${PATH}" make -C backend generate

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      - name: Build backend
        run: make -C backend build

      - name: Build migrations
        run: make -C backend/migrations build

      - name: Apply database migrations
        run: make -C backend migrate-local

      - name: Test backend with coverage
        working-directory: backend
        run: |
          set -euo pipefail
          go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')"
          awk \
            -v coverage="${total}" \
            -v threshold="${BACKEND_COVERAGE_THRESHOLD}" \
            'BEGIN {
              if (coverage + 0 < threshold + 0) {
                printf("backend coverage %.2f%% is below %.2f%%\n", coverage, threshold)
                exit 1
              }
              printf("backend coverage %.2f%% meets %.2f%% threshold\n", coverage, threshold)
            }'

      - name: Test migrations
        working-directory: backend/migrations
        run: GOWORK=off go test ./... -count=1

  cli:
    name: CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            lib/go.sum

      - name: Build CLI
        run: make -C cli build

      - name: Test CLI
        working-directory: cli
        run: go test ./... -count=1

      - name: Test shared Go library
        working-directory: lib
        run: go test ./... -count=1

  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # website/vendor/hetstar is a submodule the build compiles from source.
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Check generated CIF reference lists are current
        working-directory: website
        run: |
          npm run gen:cif-reference
          git diff --exit-code -- src/lib/parse/cifReference.gen.ts src/lib/parse/ccdCategories.gen.ts

      - name: Check generated API types are current
        working-directory: website
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.gen.ts

      - name: Typecheck
        working-directory: website
        run: npm run typecheck

      - name: Test website with coverage
        working-directory: website
        run: |
          set -euo pipefail
          node \
            --experimental-test-coverage \
            --test \
            --test-coverage-lines="${WEBSITE_COVERAGE_THRESHOLD}" \
            test/*.test.cjs

      - name: Build website
        working-directory: website
        run: npm run build

  # Drives the deposition forms in Chromium against the real backend (validation
  # in enforce mode), Postgres and an S3 stand-in. See "Browser tests" in README.md.
  browser:
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # website/vendor/hetstar is a submodule the build compiles from source.
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
            lib/go.sum

      - name: Install codegen tools
        run: make -C backend install-tools

      - name: Generate backend code
        run: PATH="$(go env GOPATH)/bin:${PATH}" make -C backend generate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Read Playwright version
        id: playwright
        working-directory: website
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "${GITHUB_OUTPUT}"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: website
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: website
        # install-deps has no --only-shell; it takes the headless shell's browser name instead.
        run: npx playwright install-deps chromium-headless-shell

      - name: Start the browser-test stack
        run: make -C website browser-stack

      - name: Run browser tests
        working-directory: website
        run: npm run test:browser

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p website/browser-test-logs
          docker compose --env-file website/e2e/stack/stack.env -f website/e2e/stack/compose.yml logs --no-color \
            > website/browser-test-logs/containers.log 2>&1 || true

      - name: Upload browser-test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            website/playwright-report/
            website/test-results/
            website/browser-test-logs/
          retention-days: 7

  # Runs integration/ against the real backend, Postgres and the mmseqs job image. Every test
  # skips unless DYNAMIC_PDB_RUN_INTEGRATION=1 (make integration-test sets it), so the last
  # step fails the job if any test skipped or none passed.
  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dynamic_pdb_local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 35432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dynamic_pdb_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # GitHub-hosted runners can't reach harbor.astera.sh (Tailscale only), so the mmseqs
      # test builds its image from the same base images on Docker Hub.
      DYNAMIC_PDB_MMSEQS_GO_IMAGE: golang:1.26-alpine
      DYNAMIC_PDB_MMSEQS_RUNTIME_IMAGE: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
            cli/go.sum
            integration/go.sum
            lib/go.sum

      - name: Install codegen tools
        run: make -C backend install-tools

      - name: Generate backend code
        run: PATH="$(go env GOPATH)/bin:${PATH}" make -C backend generate

      - name: Apply database migrations
        run: make -C backend migrate-local

      - name: Run integration tests
        run: |
          set -euo pipefail
          make integration-test INTEGRATION_TIMEOUT=15m 2>&1 | tee integration-test.log

      - name: Check every integration test ran
        run: |
          set -euo pipefail
          passed="$(grep -c '^--- PASS:' integration-test.log || true)"
          skipped="$(grep -c -- '--- SKIP:' integration-test.log || true)"
          echo "Top-level tests passed: ${passed}. Tests skipped: ${skipped}."
          if [ "${passed}" -eq 0 ] || [ "${skipped}" -ne 0 ]; then
            echo "::error::Integration tests did not all run (passed=${passed}, skipped=${skipped})."
            exit 1
          fi

  deploy-images:
    name: Build and push deploy images
    needs:
      - changes
      - backend
      - cli
      - website
      - browser
      - integration
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.cli.result == 'success' || needs.cli.result == 'skipped') &&
      (needs.website.result == 'success' || needs.website.result == 'skipped') &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped') &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    runs-on: diffuse-sh-builder
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The website image is built from website/, submodule included.
          submodules: true

      - name: Configure image tags
        run: |
          set -euo pipefail
          {
            echo "DEPLOY_IMAGE_TAG=sha-${GITHUB_SHA}"
            echo "MOVING_IMAGE_TAG=latest"
            echo "DEV_DEPLOY_IMAGE_TAG=dev-sha-${GITHUB_SHA}"
            echo "DEV_MOVING_IMAGE_TAG=dev-latest"
          } >> "${GITHUB_ENV}"

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "${HARBOR_PASSWORD}" | docker login ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

      - name: Set up Docker Buildx
        run: docker buildx create --use --name ci-builder || docker buildx use ci-builder

      - name: Build and push backend image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_PREFIX}/dynamic-pdb-backend"
          docker buildx build --push \
            --build-context lib=lib \
            -t "${IMAGE}:${DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${MOVING_IMAGE_TAG}" \
            -t "${IMAGE}:${DEV_DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${DEV_MOVING_IMAGE_TAG}" \
            -f backend/Dockerfile backend

      - name: Build and push migrations image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_PREFIX}/dynamic-pdb-migrations"
          docker buildx build --push \
            -t "${IMAGE}:${DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${MOVING_IMAGE_TAG}" \
            -t "${IMAGE}:${DEV_DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${DEV_MOVING_IMAGE_TAG}" \
            -f backend/migrations/Dockerfile backend/migrations

      - name: Build and push mmseqs job image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_PREFIX}/dynamic-pdb-mmseqs-job"
          docker buildx build --push \
            --build-context lib=lib \
            -t "${IMAGE}:${DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${MOVING_IMAGE_TAG}" \
            -t "${IMAGE}:${DEV_DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${DEV_MOVING_IMAGE_TAG}" \
            -f backend/cmd/mmseqs-job/Dockerfile backend

      - name: Build and push production website image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_PREFIX}/dynamic-pdb-website"
          docker buildx build --push \
            --build-arg NEXT_PUBLIC_API_BASE_URL="https://dynamicpdb.com/api" \
            -t "${IMAGE}:${DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${MOVING_IMAGE_TAG}" \
            -f website/Dockerfile website

      - name: Build and push dev website image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_PREFIX}/dynamic-pdb-website"
          docker buildx build --push \
            --build-arg NEXT_PUBLIC_API_BASE_URL="https://dev.dynamicpdb.com/api" \
            -t "${IMAGE}:${DEV_DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${DEV_MOVING_IMAGE_TAG}" \
            -f website/Dockerfile website

      - name: Build and push CLI image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_PREFIX}/dynamic-pdb-cli"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build --push \
            --build-context lib=lib \
            --build-arg VERSION="${DEPLOY_IMAGE_TAG}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg DATE="${DATE}" \
            -t "${IMAGE}:${DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${MOVING_IMAGE_TAG}" \
            -t "${IMAGE}:${DEV_DEPLOY_IMAGE_TAG}" \
            -t "${IMAGE}:${DEV_MOVING_IMAGE_TAG}" \
            -f cli/Dockerfile cli
